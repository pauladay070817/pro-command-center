<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<link rel="manifest" href="manifest.json">
<title>Pro Business Command Center</title>
<style>
:root{--blue:#0057b8;--blue2:#0b3d91;--green:#16823b;--red:#c62828;--yellow:#f0a429;--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--border:#d9dee7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:18px 22px}header h1{margin:0 0 5px;font-size:24px}header p{margin:0;font-size:13px;opacity:.9}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
nav button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e8eef7;color:#173b68}
nav button.active,.btn.primary{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.gray{background:#e9edf2;color:#263238}
main{max-width:1180px;margin:auto;padding:18px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000b}
h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{font-size:13px;font-weight:700;color:#344054;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.metric{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric strong{font-size:22px}
.good{color:var(--green)!important}.bad{color:var(--red)!important}.watch{color:var(--yellow)!important}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}th{background:#f7f9fb}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:700}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:82px;height:62px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}
.empty{color:var(--muted);padding:14px 0}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}main{padding:10px}.card{padding:13px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric strong{font-size:18px}}
</style>
</head>
<body>
<header><h1>Pro Business Command Center</h1><p>Store → Departments → Product Groups → Pro → Specialists → Action Plans</p></header>
<nav id="tabs"></nav>
<main>
<section id="dashboard" class="page"></section>
<section id="numbers" class="page"></section>
<section id="specialists" class="page"></section>
<section id="departments" class="page"></section>
<section id="products" class="page"></section>
<section id="actions" class="page"></section>
<section id="walks" class="page"></section>
<section id="opportunities" class="page"></section>
<section id="settings" class="page"></section>
</main>
<script>
const KEY='proCommandCenterV4';
const TAB=[
 ['dashboard','Dashboard'],['numbers','Numbers'],['specialists','Specialists'],
 ['departments','Departments'],['products','Product Groups'],['associates','Associates'],['actions','Action Plans'],
 ['walks','Daily Walks'],['opportunities','Opportunities'],['settings','Backup']
];
const starterDepartments=['Pro','Lumber','Building Materials','Millwork','Hardware','Electrical','Plumbing','Flooring','Paint','Garden','Tools','Appliances'];
let db=load(), current='dashboard', edit={};

function blank(){return {numbers:[],specialists:[],departments:[],products:[],associates:[],actions:[],walks:[],opportunities:[]}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}
function pct(n){return (Number(n)||0).toFixed(2)+'%'}
function variance(a,b){return (Number(a)||0)-(Number(b)||0)}
function variancePct(a,b){return Number(b)?((Number(a)-Number(b))/Number(b))*100:0}
function cls(v){return v>0?'good':v<0?'bad':'watch'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateToday(){const d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
function dateFmt(s){if(!s)return '';return new Date(s+'T00:00:00').toLocaleDateString()}
function statusClass(s){return s==='Complete'?'good':s==='Overdue'?'bad':s==='In Progress'?'watch':''}
function nav(){document.getElementById('tabs').innerHTML=TAB.map(([id,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function go(id){current=id;render()}

function render(){ if(view==='district'){document.querySelectorAll('.view').forEach(x=>x.style.display='none');document.getElementById('district').style.display='block';document.getElementById('district').innerHTML=renderDistrictWalkReady();return;}
 nav();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===current));
 ({dashboard:renderDashboard,numbers:renderNumbers,specialists:renderSpecialists,departments:renderDepartments,products:renderProducts,associates:renderAssociates,actions:renderActions,walks:renderWalks,opportunities:renderOpportunities,settings:renderSettings}[current])();
}

function latest(){return db.numbers.length?db.numbers.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]:null}
function renderDashboard(){
 const n=latest(), open=db.actions.filter(a=>a.status!=='Complete').length, overdue=db.actions.filter(a=>a.status!=='Complete'&&a.due&&a.due<dateToday()).length;
 const products=db.products.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).slice(0,5);
 const depts=db.departments.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).slice(0,5);
 const specialists=db.specialists.slice().sort((a,b)=>variancePct(b.sales,b.plan)-variancePct(a.sales,a.plan));
 const penetration=n&&n.store?((Number(n.pro)||0)/Number(n.store))*100:0;
 const weeks=db.numbers.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-6);
 document.getElementById('dashboard').innerHTML=`
 <div class="card"><div class="row"><div><h2 style="margin-bottom:4px">Latest Store / Pro Performance</h2><div class="small">${n?'As of '+dateFmt(n.date):'Enter your first set of numbers'}</div></div><span class="pill">Pro Penetration ${pct(penetration)}</span></div>
 <div class="grid">
 ${metric('Store Sales',money(n?.store||0))}${metric('Store Plan',money(n?.storePlan||0))}${metric('Store Variance',money(variance(n?.store,n?.storePlan)),cls(variance(n?.store,n?.storePlan)))}
 ${metric('Pro Sales',money(n?.pro||0))}${metric('Pro Plan',money(n?.proPlan||0))}${metric('Pro Variance',money(variance(n?.pro,n?.proPlan)),cls(variance(n?.pro,n?.proPlan)))}
 ${metric('Pro Variance %',pct(variancePct(n?.pro,n?.proPlan)),cls(variancePct(n?.pro,n?.proPlan)))}${metric('Pro Credit',money(n?.credit||0))}${metric('Open / Overdue Actions',open+' / '+overdue,overdue?'bad':'')}
 </div></div>
 <div class="card"><h2>Accountability Command Center</h2><div class="grid">${metric('Active Associates',db.associates.filter(a=>a.status==='Active').length)}${metric('Needs Coaching',db.associates.filter(a=>a.status==='Needs Coaching').length,db.associates.some(a=>a.status==='Needs Coaching')?'bad':'good')}${metric('Open Associate Actions',db.actions.filter(a=>a.associateId&&a.status!=='Complete').length)}${metric('Overdue Actions',overdue,overdue?'bad':'good')}</div><div style="overflow:auto;margin-top:12px">${renderAssociateDashboard()}</div></div>
 <div class="card"><h2>Manager Focus</h2><div class="grid2"><div class="metric"><small>Trend</small><strong>${trendDirection()}</strong></div><div class="metric"><small>Recommended Focus</small><strong style="font-size:15px;line-height:1.35">${esc(autoOpportunity())}</strong></div></div></div>
 <div class="card"><h2>Pro Supervisor Command Scorecard</h2><div class="grid">
 ${metric('Pro Plan Attainment',proPlanAttainment(),scoreClass(proPlanAttainment()))}
 ${metric('Pro Penetration',pct(penetration),penetration>=10?'good':'watch')}
 ${metric('Action Completion',actionCompletion(),scoreClass(actionCompletion()))}
 ${metric('Follow-up Discipline',followUpDiscipline(),scoreClass(followUpDiscipline()))}
 ${metric('Associate Accountability',associateAccountability(),scoreClass(associateAccountability()))}
 ${metric('Specialist Attainment',specialistAttainment(),scoreClass(specialistAttainment()))}
 </div><div class="small" style="margin-top:10px">Use this scorecard to run the business: know the gap, assign the owner, set the due date, follow up, and verify the result.</div></div>
 <div class="card"><h2>Opportunity Pipeline</h2>${renderPipelineDashboard()}</div><div class="card"><h2>Today's Leadership Priorities</h2>${renderLeadershipPriorities()}</div>
 <div class="card"><h2>Quick Actions</h2><div class="actions">
 <button class="btn primary" onclick="go('numbers')">+ Enter Numbers</button><button class="btn primary" onclick="go('walks')">+ Daily Walk</button>
 <button class="btn primary" onclick="go('departments')">Departments</button><button class="btn primary" onclick="go('products')">Product Groups</button><button class="btn primary" onclick="go('actions')">Action Plan</button><button class="btn primary" onclick="go('specialists')">Specialists</button><button class="btn primary" onclick="go('associates')">Associates</button><button class="btn green" onclick="go('opportunities')">+ Opportunity</button><button class="btn green" onclick="addStarterDepartments()">Load Standard Departments</button><button class="btn green" onclick="makeBottomActions()">Auto-Create Bottom 5 Actions</button></div></div>
 <div class="grid2">
 <div class="card"><h2>Bottom Department Opportunities</h2>${depts.length?'<table><tr><th>Department</th><th>Variance</th><th>Pro Variance</th></tr>'+depts.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td class="${cls(variancePct(d.sales,d.plan))}">${money(variance(d.sales,d.plan))} (${pct(variancePct(d.sales,d.plan))})</td><td class="${cls(variancePct(d.pro,d.proPlan))}">${money(variance(d.pro,d.proPlan))}</td></tr>`).join('')+'</table>':'<div class="empty">Add department numbers to see opportunities.</div>'}</div>
 <div class="card"><h2>Bottom Product-Group Opportunities</h2>${products.length?'<table><tr><th>Product Group</th><th>Variance</th><th>Priority</th></tr>'+products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="${cls(variancePct(p.sales,p.plan))}">${money(variance(p.sales,p.plan))} (${pct(variancePct(p.sales,p.plan))})</td><td>${esc(p.priority)}</td></tr>`).join('')+'</table>':'<div class="empty">Add product-group numbers to see opportunities.</div>'}</div></div>
 <div class="card"><h2>Specialist Performance & Coaching</h2><div class="grid">${metric('Specialists',db.specialists.length)}${metric('Pipeline Owned',money(db.specialists.reduce((t,s)=>t+Number(s.pipelineOwned||0),0)))}${metric('Active Pipeline',money(db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)).reduce((t,o)=>t+Number(o.estimatedSales||0),0)))}${metric('Follow-ups Due',db.specialists.reduce((t,s)=>t+Number(s.followUpsDue||0),0),db.specialists.some(s=>Number(s.followUpsDue||0)>0)?'bad':'good')}</div><table style="margin-top:12px"><tr><th>Specialist</th><th>Sales vs Plan</th><th>Pipeline</th><th>Weighted</th><th>Follow-ups</th><th>Coaching Signal</th></tr>${db.specialists.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).map(s=>{const st=specialistPipelineStats(s);return `<tr><td><b>${esc(s.name)}</b></td><td class="${cls(variancePct(s.sales,s.plan))}">${money(variance(s.sales,s.plan))} (${pct(variancePct(s.sales,s.plan))})</td><td>${money(st.sales)}</td><td>${money(st.weighted)}</td><td class="${st.due?'bad':'good'}">${st.due}</td><td>${esc(specialistCoachingSignal(s))}</td></tr>`}).join('')}</table></div><div class="card"><h2>Specialist Scoreboard</h2>${specialists.length?'<table><tr><th>Rank</th><th>Specialist</th><th>Sales</th><th>Plan</th><th>Variance</th><th>Goal</th></tr>'+specialists.map((s,i)=>`<tr><td><b>#${i+1}</b></td><td>${esc(s.name)}</td><td>${money(s.sales)}</td><td>${money(s.plan)}</td><td class="${cls(variancePct(s.sales,s.plan))}">${money(variance(s.sales,s.plan))} (${pct(variancePct(s.sales,s.plan))})</td><td>${esc(s.goal)}</td></tr>`).join('')+'</table>':'<div class="empty">Add specialists to build the scoreboard.</div>'}</div>
 <div class="grid2">
 <div class="card"><h2>Pro Sales Trend</h2>${weeks.length?'<table><tr><th>Week</th><th>Pro Sales</th><th>Plan</th><th>Var %</th></tr>'+weeks.map(w=>`<tr><td>${dateFmt(w.date)}</td><td>${money(w.pro)}</td><td>${money(w.proPlan)}</td><td class="${cls(variancePct(w.pro,w.proPlan))}">${pct(variancePct(w.pro,w.proPlan))}</td></tr>`).join('')+'</table>':'<div class="empty">Enter multiple weeks to see your trend.</div>'}</div>
 <div class="card"><h2>Open Action Plans</h2>${open?'<table><tr><th>Opportunity</th><th>Owner</th><th>Due</th><th>Status</th></tr>'+db.actions.filter(a=>a.status!=='Complete').slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,8).map(a=>{let over=a.due&&a.due<dateToday();return `<tr><td><b>${esc(a.opportunity)}</b><div class="small">${esc(a.action)}</div></td><td>${esc(a.owner)}</td><td>${a.due?dateFmt(a.due):'—'}</td><td class="${statusClass(over?'Overdue':a.status)}">${over?'Overdue':esc(a.status)}</td></tr>`}).join('')+'</table>':'<div class="empty">No open action plans.</div>'}</div></div>`;
}
function renderAssociateDashboard(){const rows=db.associates.slice().sort((a,b)=>db.actions.filter(x=>x.associateId===b.id&&x.status!=='Complete').length-db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete').length);if(!rows.length)return '<div class="empty">Add associates to build the accountability dashboard.</div>';return '<table><tr><th>Associate</th><th>Department</th><th>Status</th><th>Walks</th><th>Open Actions</th><th>Overdue</th><th>Last Walk</th><th></th></tr>'+rows.map(a=>{const walks=db.walks.filter(w=>w.associateId===a.id).sort((x,y)=>y.date.localeCompare(x.date));const acts=db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete');const over=acts.filter(x=>x.due&&x.due<dateToday()).length;return '<tr><td><b>'+esc(a.name)+'</b></td><td>'+esc(a.department||'')+'</td><td>'+esc(a.status)+'</td><td>'+walks.length+'</td><td>'+acts.length+'</td><td class="'+(over?'bad':'good')+'">'+over+'</td><td>'+(walks.length?dateFmt(walks[0].date):'—')+'</td><td><button class="btn primary" onclick="viewAssociate(\''+a.id+'\')">View</button></td></tr>'}).join('')+'</table>';}
function viewAssociate(i){const a=db.associates.find(x=>x.id===i);if(!a)return;const walks=db.walks.filter(w=>w.associateId===i).sort((x,y)=>y.date.localeCompare(x.date));const acts=db.actions.filter(x=>x.associateId===i);const open=acts.filter(x=>x.status!=='Complete');const overdue=open.filter(x=>x.due&&x.due<dateToday());const complete=acts.filter(x=>x.status==='Complete');document.getElementById('dashboard').innerHTML='<div class="card"><div class="row"><div><h2>'+esc(a.name)+'</h2><div class="small">'+esc(a.department||'')+' · '+esc(a.role||'')+'</div></div><button class="btn gray" onclick="go(\'dashboard\')">Back to Dashboard</button></div><div class="grid" style="margin-top:14px">'+metric('Goal',esc(a.goal||'—'))+metric('Status',esc(a.status||'—'),a.status==='Needs Coaching'?'bad':'')+metric('Open Actions',open.length,open.length?'watch':'good')+metric('Overdue',overdue.length,overdue.length?'bad':'good')+'</div></div><div class="card"><h3>Accountability / Coaching Signal</h3><p>'+esc(a.notes||'No accountability notes recorded.')+'</p>'+((overdue.length||a.status==='Needs Coaching')?'<div class="metric bad"><small>Attention Needed</small><strong style="font-size:15px">Review overdue follow-ups and document the next coaching conversation.</strong></div>':'<div class="metric"><small>Current Signal</small><strong style="font-size:15px">On track — continue scheduled follow-up.</strong></div>')+'</div><div class="card"><h3>Open / Overdue Actions</h3>'+(open.length?'<table><tr><th>Status</th><th>Opportunity</th><th>Action</th><th>Due</th><th></th></tr>'+open.map(x=>{const over=x.due&&x.due<dateToday();return '<tr><td class="'+statusClass(over?'Overdue':x.status)+'"><b>'+(over?'Overdue':esc(x.status))+'</b></td><td>'+esc(x.opportunity)+'</td><td>'+esc(x.action)+'</td><td>'+(x.due?dateFmt(x.due):'—')+'</td><td><button class="btn gray" onclick="editAction(\''+x.id+'\')">Open</button></td></tr>'}).join('')+'</table>':'<div class="empty">No open actions.</div>')+'</div><div class="card"><h3>Walk History</h3>'+(walks.length?walks.map(w=>'<div class="card" style="box-shadow:none;margin:0 0 10px"><div class="row"><b>'+dateFmt(w.date)+'</b><span class="pill">'+esc(w.department||'')+'</span></div><p><b>Finding:</b> '+esc(w.result)+'</p><p><b>Opportunity:</b> '+esc(w.opportunity)+'</p><p><b>Action:</b> '+esc(w.action)+'</p><p><b>Follow-up:</b> '+esc(w.follow)+(w.followDue?' · Due '+dateFmt(w.followDue):'')+'</p>'+(w.photos?.length?'<div class="thumbs">'+w.photos.map(x=>'<img src="'+x+'">').join('')+'</div>':'')+'</div>').join(''):'<div class="empty">No walk history.</div>')+'</div><div class="card"><h3>Completed Actions</h3>'+(complete.length?'<table><tr><th>Opportunity</th><th>Action</th><th>Completed</th></tr>'+complete.map(x=>'<tr><td>'+esc(x.opportunity)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.due?dateFmt(x.due):'—')+'</td></tr>').join('')+'</table>':'<div class="empty">No completed actions yet.</div>')+'</div>';current='dashboard';nav();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='dashboard'));}function metric(a,b,c=''){return `<div class="metric"><small>${a}</small><strong class="${c}">${b}</strong></div>`}

function scoreClass(v){return v==='—'?'watch':Number(String(v).replace('%',''))>=90?'good':Number(String(v).replace('%',''))>=75?'watch':'bad'}
function proPlanAttainment(){const n=latest();if(!n||!n.proPlan)return '—';return pct((Number(n.pro||0)/Number(n.proPlan))*100)}
function actionCompletion(){if(!db.actions.length)return '—';return pct((db.actions.filter(a=>a.status==='Complete').length/db.actions.length)*100)}
function followUpDiscipline(){const due=db.actions.filter(a=>a.due);if(!due.length)return '—';const onTime=due.filter(a=>a.status==='Complete').length;return pct((onTime/due.length)*100)}
function associateAccountability(){if(!db.associates.length)return '—';const healthy=db.associates.filter(a=>{const open=db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete');const over=open.some(x=>x.due&&x.due<dateToday());return a.status!=='Needs Coaching'&&!over}).length;return pct((healthy/db.associates.length)*100)}
function specialistAttainment(){if(!db.specialists.length)return '—';const good=db.specialists.filter(s=>Number(s.plan)>0&&Number(s.sales)>=Number(s.plan)).length;return pct((good/db.specialists.length)*100)}
function renderPipelineDashboard(){const open=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage));const pipeline=open.reduce((s,o)=>s+Number(o.estimatedSales||0),0);const weighted=open.reduce((s,o)=>s+Number(o.estimatedSales||0)*(Number(o.probability||0)/100),0);const due=open.filter(o=>o.nextFollowUp&&o.nextFollowUp<=dateToday()).length;const won=db.opportunities.filter(o=>o.stage==='Won').reduce((s,o)=>s+Number(o.estimatedSales||0),0);const rows=open.slice().sort((a,b)=>(b.estimatedSales||0)-(a.estimatedSales||0)).slice(0,5);return '<div class="grid">'+metric('Open Pipeline',money(pipeline))+metric('Weighted Pipeline',money(weighted))+metric('Follow-ups Due',due,due?'bad':'good')+metric('Won Opportunity Sales',money(won),'good')+'</div>'+(rows.length?'<table style="margin-top:12px"><tr><th>Customer / Company</th><th>Type</th><th>Stage</th><th>Est. Sales</th><th>Follow-up</th></tr>'+rows.map(o=>'<tr><td><b>'+esc(o.customer||'Unnamed')+'</b><div class="small">'+esc(o.company||'')+'</div></td><td>'+esc(o.type)+'</td><td>'+esc(o.stage)+'</td><td>'+money(o.estimatedSales)+'</td><td class="'+(o.nextFollowUp&&o.nextFollowUp<=dateToday()?'bad':'')+'">'+(o.nextFollowUp?dateFmt(o.nextFollowUp):'—')+'</td></tr>').join('')+'</table>':'<div class="empty" style="margin-top:10px">No active opportunities yet. Start building your Pro pipeline.</div>')+'<div class="actions"><button class="btn primary" onclick="go(\'opportunities\')">Open Opportunity Pipeline</button></div>'}

function trendDirection(){

}

function renderAssociateDevelopment(){const rows=db.associates.slice().sort((a,b)=>(b.lastCoaching||'').localeCompare(a.lastCoaching||''));return '<div class="card"><h2>Associate Coaching & Development</h2><div class="grid">'+metric('Associates',rows.length)+metric('Coaching Records',rows.reduce((t,a)=>t+(a.coaching?.length||0),0))+metric('Needs Coaching',rows.filter(a=>a.status==='Needs Coaching').length,rows.some(a=>a.status==='Needs Coaching')?'bad':'good')+metric('No Recent Coaching',rows.filter(a=>!a.lastCoaching).length,rows.some(a=>!a.lastCoaching)?'watch':'good')+'</div>'+(rows.length?'<table style="margin-top:12px"><tr><th>Associate</th><th>Status</th><th>Last Coaching</th><th>Open Actions</th><th>Development Goal</th><th></th></tr>'+rows.map(a=>{const open=db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete').length;return '<tr><td><b>'+esc(a.name)+'</b><div class="small">'+esc(a.department||'')+' · '+esc(a.role||'')+'</div></td><td class="'+(a.status==='Needs Coaching'?'bad':'')+'">'+esc(a.status)+'</td><td>'+(a.lastCoaching?dateFmt(a.lastCoaching):'Not documented')+'</td><td class="'+(open?'watch':'good')+'">'+open+'</td><td>'+esc(a.goal||'—')+'</td><td><button class="btn primary" onclick="addCoaching(\''+a.id+'\')">Document Coaching</button></td></tr>'}).join('')+'</table>':'<div class="empty">Add associates to begin development tracking.</div>')+'<div style="margin-top:12px">'+rows.slice(0,6).map(a=>'<div class="card" style="box-shadow:none;margin:0 0 8px"><div class="row"><b>'+esc(a.name)+'</b><span class="pill">'+(a.lastCoaching?'Last coaching '+dateFmt(a.lastCoaching):'No coaching yet')+'</span></div>'+renderCoachingHistory(a)+'</div>').join('')+'</div></div>'}
function renderDistrictWalkReady(){const latest=db.numbers.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];const open=db.actions.filter(a=>a.status!=='Complete'),overdue=open.filter(a=>a.due&&a.due<dateToday()),dueOpp=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)&&o.nextFollowUp&&o.nextFollowUp<=dateToday()),belowSpec=db.specialists.filter(s=>variance(s.sales,s.plan)<0),weakDept=db.departments.filter(d=>departmentPartnershipScore(d)<60),needsCoaching=db.associates.filter(a=>a.status==='Needs Coaching');const pipe=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)).reduce((t,o)=>t+Number(o.estimatedSales||0),0),weighted=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)).reduce((t,o)=>t+Number(o.estimatedSales||0)*(Number(o.probability||0)/100),0);return '<div class="card"><div class="row"><div><h2>District Walk Ready</h2><p class="small">Executive snapshot of results, gaps, opportunities, accountability and next actions.</p></div><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="grid">'+metric('Pro Sales',latest?money(latest.proSales):'$0')+metric('Pro Var',latest?money(variance(latest.proSales,latest.proPlan)):'$0',latest&&variance(latest.proSales,latest.proPlan)<0?'bad':'good')+metric('Open Pipeline',money(pipe))+metric('Weighted Pipeline',money(weighted))+metric('Overdue Actions',overdue.length,overdue.length?'bad':'good')+metric('Specialists Below Plan',belowSpec.length,belowSpec.length?'watch':'good')+metric('Departments Needing Partnership',weakDept.length,weakDept.length?'watch':'good')+metric('Associates Needing Coaching',needsCoaching.length,needsCoaching.length?'watch':'good')+'</div><div class="grid" style="margin-top:12px"><div class="card" style="box-shadow:none"><h3>Leadership Wins</h3><ul><li>'+ (latest?'Latest Pro sales recorded for '+dateFmt(latest.date):'Enter current numbers') +'</li><li>'+db.opportunities.filter(o=>o.stage==='Won').length+' opportunities won</li><li>'+db.actions.filter(a=>a.status==='Complete').length+' action plans completed</li></ul></div><div class="card" style="box-shadow:none"><h3>Leadership Gaps</h3><ul><li>'+overdue.length+' overdue actions</li><li>'+dueOpp.length+' opportunity follow-ups due</li><li>'+belowSpec.length+' specialists below plan</li><li>'+weakDept.length+' departments below partnership threshold</li></ul></div></div><h3>Top Actions Before the Walk</h3><table><tr><th>Priority</th><th>Owner</th><th>Action</th><th>Due</th></tr>'+(open.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,8).map(a=>'<tr><td><b>'+esc(a.opportunity||a.result||'Action')+'</b></td><td>'+esc(a.owner||'Unassigned')+'</td><td>'+esc(a.action||'')+'</td><td>'+(a.due?dateFmt(a.due):'No date')+'</td></tr>').join('')||'<tr><td colspan="4">No open actions.</td></tr>')+'</table><h3>Specialist Scorecard</h3><table><tr><th>Specialist</th><th>Sales</th><th>Plan</th><th>Variance</th><th>Pipeline</th></tr>'+(db.specialists.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+money(s.sales)+'</td><td>'+money(s.plan)+'</td><td class="'+(variance(s.sales,s.plan)<0?'bad':'good')+'">'+money(variance(s.sales,s.plan))+'</td><td>'+money(specialistPipelineStats(s).sales)+'</td></tr>').join('')||'<tr><td colspan="5">No specialists entered.</td></tr>')+'</table></div>'}
function renderProducts(){
 const sorted=db.products.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan));
 document.getElementById('products').innerHTML=`<div class="card"><h2>${edit.p?'Edit':'Add'} Product Group</h2><div class="grid2">
 <label>Product Group<input id="p_name" value="${esc(edit.p?.name||'')}"></label><label>Department<input id="p_department" value="${esc(edit.p?.department||'')}"></label>
 <label>Sales<input id="p_sales" type="number" step=".01" value="${edit.p?.sales??''}"></label><label>Owner<input id="p_owner" value="${esc(edit.p?.owner||'')}"></label>
 <label>Sales Plan<input id="p_plan" type="number" step=".01" value="${edit.p?.plan??''}"></label><label>Priority<select id="p_priority"><option>Normal</option><option ${edit.p?.priority==='High'?'selected':''}>High</option><option ${edit.p?.priority==='Critical'?'selected':''}>Critical</option></select></label>
 <label style="grid-column:1/-1">Opportunity / Action<textarea id="p_notes">${esc(edit.p?.notes||'')}</textarea></label></div>
 <div class="actions"><button class="btn primary" onclick="saveProduct()">Save Product Group</button><button class="btn gray" onclick="edit={};renderProducts()">Clear</button><button class="btn green" onclick="makeBottomActions()">Create Actions for Bottom 5</button></div></div>
 <div class="card"><h2>Product Group Performance — Worst First</h2>${sorted.length?`<table><tr><th>Product Group</th><th>Department</th><th>Owner</th><th>Sales</th><th>Plan</th><th>Variance</th><th>Priority</th><th></th></tr>${sorted.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="small">${esc(p.notes)}</div></td><td>${esc(p.department||'')}</td><td>${esc(p.owner||'')}</td><td>${money(p.sales)}</td><td>${money(p.plan)}</td><td class="${cls(variancePct(p.sales,p.plan))}">${money(variance(p.sales,p.plan))} (${pct(variancePct(p.sales,p.plan))})</td><td>${esc(p.priority)}</td><td><button class="btn gray" onclick="editProduct('${p.id}')">Edit</button> <button class="btn red" onclick="del('products','${p.id}')">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">Add product groups to begin ranking opportunities.</div>'}</div>`;
}
function saveProduct(){const p={id:edit.p?.id||id(),name:v('p_name'),sales:+v('p_sales'),plan:+v('p_plan'),priority:v('p_priority'),notes:v('p_notes'),department:v('p_department'),owner:v('p_owner')};if(!p.name){alert('Enter a product group.');return}upsert('products',p);edit={};go('products')}
function editProduct(i){edit.p=db.products.find(x=>x.id===i);go('products')}
function makeBottomActions(){db.products.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).slice(0,5).forEach(p=>{if(!db.actions.some(a=>a.sourceId===p.id&&a.status!=='Complete'))db.actions.push({id:id(),result:`${money(p.sales)} sales vs ${money(p.plan)} plan`,opportunity:p.notes||`Improve ${p.name}`,action:'Build recovery plan and review weekly',owner:'',goal:'Return to plan',due:'',status:'Open',source:'Product Group',sourceId:p.id})});save();go('actions')}

function renderActions(){
 const rows=db.actions.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
 document.getElementById('actions').innerHTML=`<div class="card"><h2>${edit.a?'Edit':'New'} Action Plan</h2><div class="grid2">
 <label>Result / Current State<textarea id="a_result">${esc(edit.a?.result||'')}</textarea></label><label>Opportunity<textarea id="a_opp">${esc(edit.a?.opportunity||'')}</textarea></label>
 <label>Action<textarea id="a_action">${esc(edit.a?.action||'')}</textarea></label><label>Owner<input id="a_owner" value="${esc(edit.a?.owner||'')}"></label>
 <label>Goal<input id="a_goal" value="${esc(edit.a?.goal||'')}"></label><label>Due Date<input id="a_due" type="date" value="${edit.a?.due||''}"></label>
 <label>Status<select id="a_status">${['Open','In Progress','Complete'].map(x=>`<option ${edit.a?.status===x?'selected':''}>${x}</option>`).join('')}</select></label>
 <label>Source<input id="a_source" value="${esc(edit.a?.source||'Manual')}"></label><label>Associate<select id="a_associate"><option value="">Unassigned</option>${db.associates.map(x=>`<option value="${x.id}" ${edit.a?.associateId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
 <div class="actions"><button class="btn primary" onclick="saveAction()">Save Action Plan</button><button class="btn gray" onclick="edit={};renderActions()">Clear</button></div></div>
 <div class="card"><h2>Action Plans</h2>${rows.length?`<table><tr><th>Status</th><th>Opportunity / Action</th><th>Owner</th><th>Goal</th><th>Due</th><th></th></tr>${rows.map(a=>{let over=a.status!=='Complete'&&a.due&&a.due<dateToday();return `<tr><td class="${statusClass(over?'Overdue':a.status)}"><b>${over?'Overdue':esc(a.status)}</b><div class="small">${esc(a.source)}</div></td><td><b>${esc(a.opportunity)}</b><div>${esc(a.action)}</div><div class="small">${esc(a.result)}</div></td><td>${esc(a.owner)}</td><td>${esc(a.goal)}</td><td>${a.due?dateFmt(a.due):'—'}</td><td><button class="btn gray" onclick="editAction('${a.id}')">Edit</button> <button class="btn red" onclick="del('actions','${a.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No action plans yet.</div>'}</div>`;
}
function saveAction(){const a={id:edit.a?.id||id(),result:v('a_result'),opportunity:v('a_opp'),action:v('a_action'),owner:v('a_owner'),goal:v('a_goal'),due:v('a_due'),status:v('a_status'),source:v('a_source')||'Manual',associateId:v('a_associate')};if(!a.opportunity&&!a.action){alert('Enter an opportunity or action.');return}upsert('actions',a);edit={};go('actions')}
function editAction(i){edit.a=db.actions.find(x=>x.id===i);go('actions')}

function renderWalks(){
 document.getElementById('walks').innerHTML=`<div class="card"><h2>${edit.w?'Edit':'New'} Daily Pro Walk</h2><div class="grid2">
 <label>Date<input id="w_date" type="date" value="${edit.w?.date||dateToday()}"></label><label>Owner<input id="w_owner" value="${esc(edit.w?.owner||'')}"></label>
 <label>Associate<select id="w_associate"><option value="">Unassigned</option>${db.associates.map(x=>`<option value="${x.id}" ${edit.w?.associateId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
 <label>Department<select id="w_dept"><option value="">Select department</option>${db.departments.map(d=>`<option ${edit.w?.department===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>
 <label>Result / Finding<textarea id="w_result">${esc(edit.w?.result||'')}</textarea></label><label>Opportunity<textarea id="w_opp">${esc(edit.w?.opportunity||'')}</textarea></label>
 <label>Action / Goal<textarea id="w_action">${esc(edit.w?.action||'')}</textarea></label><label>Follow-up<input id="w_follow" value="${esc(edit.w?.follow||'')}"></label>
 <label>Follow-up Due<input id="w_due" type="date" value="${edit.w?.followDue||''}"></label>
 <label style="grid-column:1/-1">Photos<input id="w_photos" type="file" accept="image/*" multiple></label></div>
 ${edit.w?.photos?.length?`<div class="thumbs">${edit.w.photos.map(x=>`<img src="${x}">`).join('')}</div>`:''}
 <div class="actions"><button class="btn primary" onclick="saveWalk()">Save Walk</button><button class="btn green" onclick="saveWalk(true)">Save Walk + Create Action</button><button class="btn gray" onclick="edit={};renderWalks()">Clear</button></div></div>
 <div class="card"><h2>Walk History</h2>${db.walks.length?db.walks.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="card" style="box-shadow:none;margin:0 0 10px"><div class="row"><b>${dateFmt(w.date)} — ${esc(w.owner)}</b><div><button class="btn gray" onclick="editWalk('${w.id}')">Edit</button> <button class="btn red" onclick="del('walks','${w.id}')">Delete</button></div></div><p><b>Associate:</b> ${esc(db.associates.find(a=>a.id===w.associateId)?.name||'Unassigned')} &nbsp; <b>Department:</b> ${esc(w.department||'')}</p><p><b>Finding:</b> ${esc(w.result)}</p><p><b>Opportunity:</b> ${esc(w.opportunity)}</p><p><b>Action:</b> ${esc(w.action)}</p><p><b>Follow-up:</b> ${esc(w.follow)}</p>${w.photos?.length?`<div class="thumbs">${w.photos.map(x=>`<img src="${x}">`).join('')}</div>`:''}</div>`).join(''):'<div class="empty">No walks yet.</div>'}</div>`;
}
async function saveWalk(createAction=false){
 const files=[...document.getElementById('w_photos').files]; let photos=edit.w?.photos?[...edit.w.photos]:[];
 for(const f of files){try{photos.push(await readFile(f))}catch(e){}}
 const w={id:edit.w?.id||id(),date:v('w_date'),owner:v('w_owner'),associateId:v('w_associate'),department:v('w_dept'),result:v('w_result'),opportunity:v('w_opp'),action:v('w_action'),follow:v('w_follow'),followDue:v('w_due'),photos};
 if(!w.date){alert('Enter a date.');return}
 if(createAction){
  if(!w.associateId){alert('Select an associate before creating an action.');return}
  if(!w.opportunity&&!w.action){alert('Enter an opportunity or action before creating an action plan.');return}
 }
 upsert('walks',w);
 if(createAction){
  const existing=db.actions.find(a=>a.source==='Daily Walk'&&a.sourceId===w.id);
  const assoc=db.associates.find(a=>a.id===w.associateId);
  const action={id:existing?.id||id(),result:w.result,opportunity:w.opportunity||'Daily walk follow-up',action:w.action||'Complete follow-up from daily walk',owner:assoc?.name||w.owner,goal:w.follow||'Complete follow-up and verify improvement',due:w.followDue||dateToday(),status:existing?.status||'Open',source:'Daily Walk',sourceId:w.id,associateId:w.associateId};
  if(existing){Object.assign(existing,action)}else db.actions.push(action);
 }
 edit={};save();go(createAction?'actions':'walks')
}
function editWalk(i){edit.w=db.walks.find(x=>x.id===i);go('walks')}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}

function opportunityProbability(stage){return ({New:10,Contacted:25,Quoted:50,'Follow-up':70,Won:100,Lost:0}[stage]??10)}
function renderOpportunities(){
 const rows=db.opportunities.slice().sort((a,b)=>(a.nextFollowUp||'9999').localeCompare(b.nextFollowUp||'9999'));
 const open=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage));
 const pipeline=open.reduce((s,o)=>s+Number(o.estimatedSales||0),0);
 const weighted=open.reduce((s,o)=>s+Number(o.estimatedSales||0)*(Number(o.probability||0)/100),0);
 const due=open.filter(o=>o.nextFollowUp&&o.nextFollowUp<=dateToday()).length;
 document.getElementById('opportunities').innerHTML=`<div class="card"><h2>${edit.o?'Edit':'New'} Pro Opportunity</h2><div class="grid2">
 <label>Customer / Contractor<input id="o_customer" value="${esc(edit.o?.customer||'')}"></label>
 <label>Company / Account<input id="o_company" value="${esc(edit.o?.company||'')}"></label>
 <label>Opportunity Type<select id="o_type">${['Quote','Project','Install','Pro Account','Credit','Other'].map(x=>`<option ${edit.o?.type===x?'selected':''}>${x}</option>`).join('')}</select></label>
 <label>Estimated Sales<input id="o_sales" type="number" step=".01" value="${edit.o?.estimatedSales??''}"></label>
 <label>Stage<select id="o_stage" onchange="setOppProbability()">${['New','Contacted','Quoted','Follow-up','Won','Lost'].map(x=>`<option ${edit.o?.stage===x?'selected':''}>${x}</option>`).join('')}</select></label>
 <label>Probability %<input id="o_probability" type="number" min="0" max="100" step="5" value="${edit.o?.probability??10}"></label>
 <label>Owner<input id="o_owner" value="${esc(edit.o?.owner||'')}"></label>
 <label>Next Follow-up<input id="o_follow" type="date" value="${edit.o?.nextFollowUp||''}"></label>
 <label>Source<input id="o_source" value="${esc(edit.o?.source||'Walk-in / Referral')}"></label>
 <label style="grid-column:1/-1">Notes<textarea id="o_notes">${esc(edit.o?.notes||'')}</textarea></label></div>
 <div class="actions"><button class="btn primary" onclick="saveOpportunity()">Save Opportunity</button><button class="btn gray" onclick="edit={};renderOpportunities()">Clear</button></div></div>
 <div class="card"><h2>Pipeline Scorecard</h2><div class="grid">${metric('Open Pipeline',money(pipeline))}${metric('Weighted Pipeline',money(weighted))}${metric('Follow-ups Due',due,due?'bad':'good')}${metric('Total Opportunities',db.opportunities.length)}</div></div>
 <div class="card"><h2>Opportunity Pipeline</h2>${rows.length?`<table><tr><th>Customer / Company</th><th>Type</th><th>Stage</th><th>Est. Sales</th><th>Probability</th><th>Follow-up</th><th>Owner</th><th></th></tr>${rows.map(o=>{const overdue=!['Won','Lost'].includes(o.stage)&&o.nextFollowUp&&o.nextFollowUp<dateToday();return `<tr><td><b>${esc(o.customer||'Unnamed')}</b><div class="small">${esc(o.company||'')}</div><div class="small">${esc(o.notes||'')}</div></td><td>${esc(o.type)}</td><td>${esc(o.stage)}</td><td>${money(o.estimatedSales)}</td><td>${Number(o.probability||0)}%</td><td class="${overdue?'bad':''}">${o.nextFollowUp?dateFmt(o.nextFollowUp):'—'}${overdue?' · OVERDUE':''}</td><td>${esc(o.owner||'Unassigned')}</td><td><button class="btn green" onclick="createOpportunityAction('${o.id}')">Action</button> <button class="btn gray" onclick="editOpportunity('${o.id}')">Edit</button> <button class="btn red" onclick="del('opportunities','${o.id}')">Delete</button></td></tr>`}).join('')}</table>`:'<div class="empty">No opportunities yet. Add your first contractor/project opportunity above.</div>'}</div>`;
}
function setOppProbability(){const s=v('o_stage');const p=document.getElementById('o_probability');if(p&&!edit.o)p.value=opportunityProbability(s)}
function saveOpportunity(){const o={id:edit.o?.id||id(),date:edit.o?.date||dateToday(),customer:v('o_customer'),company:v('o_company'),type:v('o_type'),estimatedSales:+v('o_sales'),probability:Math.max(0,Math.min(100,+v('o_probability'))),stage:v('o_stage'),owner:v('o_owner'),nextFollowUp:v('o_follow'),source:v('o_source'),notes:v('o_notes')};if(!o.customer&&!o.company){alert('Enter a customer or company.');return}if(o.stage==='Won')o.probability=100;if(o.stage==='Lost')o.probability=0;upsert('opportunities',o);edit={};go('opportunities')}
function editOpportunity(i){edit.o=db.opportunities.find(x=>x.id===i);go('opportunities')}
function createOpportunityAction(i){const o=db.opportunities.find(x=>x.id===i);if(!o)return;const existing=db.actions.find(a=>a.opportunityId===o.id&&a.status!=='Complete');if(existing){edit.a=existing;go('actions');return}db.actions.push({id:id(),result:money(o.estimatedSales)+' estimated opportunity at '+o.stage,opportunity:(o.customer||o.company)+' — '+o.type,action:'Complete next follow-up and advance opportunity',owner:o.owner||'',goal:'Advance to next pipeline stage',due:o.nextFollowUp||dateToday(),status:'Open',source:'Opportunity Pipeline',sourceId:'Opportunity',opportunityId:o.id,associateId:''});save();go('actions')}
function renderSettings(){
 document.getElementById('settings').innerHTML=`<div class="card"><h2>Backup / Restore</h2><p class="small">Your records are stored in this browser. Export a backup before changing computers or browsers.</p>
 <div class="actions"><button class="btn primary" onclick="exportData()">Export Backup</button><label class="btn gray" style="display:inline-block;cursor:pointer">Restore Backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreData(this)"></label><button class="btn red" onclick="clearAll()">Clear All Data</button></div></div>
 <div class="card"><h2>Current Record Counts</h2><div class="grid">${metric('Numbers',db.numbers.length)}${metric('Specialists',db.specialists.length)}${metric('Departments',db.departments.length)}${metric('Product Groups',db.products.length)}${metric('Associates',db.associates.length)}${metric('Actions',db.actions.length)}${metric('Daily Walks',db.walks.length)}${metric('Opportunities',db.opportunities.length)}</div></div>`;
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pro-command-center-backup-'+dateToday()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=Object.assign(blank(),JSON.parse(r.result));save();alert('Backup restored.')}catch(e){alert('That backup could not be read.')}};r.readAsText(f)}
function clearAll(){if(confirm('Delete all Command Center data from this browser? This cannot be undone unless you have an exported backup.')){db=blank();save()}}
function v(id){return document.getElementById(id)?.value||''}
function upsert(type,obj){const i=db[type].findIndex(x=>x.id===obj.id);if(i>=0)db[type][i]=obj;else db[type].push(obj);save()}
function del(type,i){if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!==i);save()}}

render();
</script>
</body>
