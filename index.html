<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<link rel="manifest" href="manifest.json">
<title>Pro Business Command Center</title>
<style>
:root{--blue:#0057b8;--blue2:#0b3d91;--green:#16823b;--red:#c62828;--yellow:#f0a429;--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--border:#d9dee7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:18px 22px}header h1{margin:0 0 5px;font-size:24px}header p{margin:0;font-size:13px;opacity:.9}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
nav button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e8eef7;color:#173b68}
nav button.active,.btn.primary{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.gray{background:#e9edf2;color:#263238}
main{max-width:1180px;margin:auto;padding:18px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0000000b}
h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{font-size:13px;font-weight:700;color:#344054;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.metric{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric strong{font-size:22px}
.good{color:var(--green)!important}.bad{color:var(--red)!important}.watch{color:var(--yellow)!important}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}th{background:#f7f9fb}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:700}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:82px;height:62px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}
.empty{color:var(--muted);padding:14px 0}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}main{padding:10px}.card{padding:13px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric strong{font-size:18px}}
</style>
</head>
<body>
<header><h1>Pro Business Command Center</h1><p>Store → Departments → Product Groups → Pro → Specialists → Action Plans</p></header>
<nav id="tabs"></nav>
<main>
<section id="dashboard" class="page"></section>
<section id="numbers" class="page"></section>
<section id="specialists" class="page"></section>
<section id="departments" class="page"></section>
<section id="products" class="page"></section>
<section id="actions" class="page"></section>
<section id="walks" class="page"></section>
<section id="photos" class="page"></section>
<section id="review" class="page"></section>
<section id="wins" class="page"></section>
<section id="scorecards" class="page"></section>
<section id="executive" class="page"></section>
<section id="opportunities" class="page"></section>
<section id="services" class="page"></section>
<section id="deliveries" class="page"></section>
<section id="customers" class="page"></section>
<section id="quotes" class="page"></section>
<section id="credit" class="page"></section>
<section id="goals" class="page"></section>
<section id="growth" class="page"></section>
<section id="priorities" class="page"></section>
<section id="brief" class="page"></section>
<section id="district" class="page"></section>
<section id="settings" class="page"></section>
</main>
<script>
const KEY='proCommandCenterV4';
const TAB=[
 ['dashboard','Dashboard'],['numbers','Numbers'],['specialists','Specialists'],
 ['departments','Departments'],['products','Product Groups'],['associates','Associates'],['actions','Action Plans'],
 ['walks','Daily Walks'],['photos','Photo Intelligence'],['review','Business Review'],['wins','Recognition & Wins'],['scorecards','Team Scorecards'],['executive','Executive Command'],['opportunities','Opportunities'],['services','Services & Install'],['deliveries','Delivery & Execution'],['customers','Customers'],['quotes','Quotes / MVD'],['credit','Credit Growth'],['goals','Goals & KPIs'],['growth','Growth Tracker'],['priorities','Daily Priorities'],['brief','Daily Brief'],['district','District Walk'],['rhythm','Operating Rhythm'],['weekly','Weekly Command Board'],['quick','Quick Entry'],['capture','Photo Capture'],['followup','Follow-Up Control'],['settings','Backup']
];
const starterDepartments=['Pro','Lumber','Building Materials','Millwork','Hardware','Electrical','Plumbing','Flooring','Paint','Garden','Tools','Appliances'];
let db=load(), current='dashboard', edit={};

function blank(){return {numbers:[],specialists:[],departments:[],products:[],associates:[],actions:[],walks:[],opportunities:[],deliveries:[],wins:[],coaching:[]}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}
function pct(n){return (Number(n)||0).toFixed(2)+'%'}
function variance(a,b){return (Number(a)||0)-(Number(b)||0)}
function variancePct(a,b){return Number(b)?((Number(a)-Number(b))/Number(b))*100:0}
function cls(v){return v>0?'good':v<0?'bad':'watch'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateToday(){const d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
function dateFmt(s){if(!s)return '';return new Date(s+'T00:00:00').toLocaleDateString()}
function statusClass(s){return s==='Complete'?'good':s==='Overdue'?'bad':s==='In Progress'?'watch':''}
function nav(){document.getElementById('tabs').innerHTML=TAB.map(([id,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function go(id){current=id;render()}

function render(){
 nav();
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===current));
 const renderers={dashboard:renderDashboard,numbers:renderNumbers,specialists:renderSpecialists,departments:renderDepartments,products:renderProducts,associates:renderAssociates,actions:renderActions,walks:renderWalks,photos:renderPhotoIntelligence,review:renderBusinessReview,wins:renderRecognitionWins,scorecards:renderTeamScorecards,executive:renderExecutiveCommand,opportunities:renderOpportunities,services:renderServicesInstall,deliveries:renderDeliveryTracker,customers:renderCustomerTracker,quotes:renderQuoteTracker,credit:renderCreditTracker,goals:renderGoalCenter,growth:renderGrowthTracker,priorities:renderSmartPriorities,brief:renderDailyBrief,district:renderDistrictWalkReady,rhythm:renderOperatingRhythm,weekly:renderWeeklyCommandBoard,quick:renderQuickEntry,capture:renderPhotoCapture,followup:renderFollowUpControl,settings:renderSettings};
 if(renderers[current]) renderers[current]();
}

function latest(){return db.numbers.length?db.numbers.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]:null}
function renderDashboard(){
 const n=latest(), open=db.actions.filter(a=>a.status!=='Complete').length, overdue=db.actions.filter(a=>a.status!=='Complete'&&a.due&&a.due<dateToday()).length;
 const products=db.products.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).slice(0,5);
 const depts=db.departments.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).slice(0,5);
 const specialists=db.specialists.slice().sort((a,b)=>variancePct(b.sales,b.plan)-variancePct(a.sales,a.plan));
 const penetration=n&&n.store?((Number(n.pro)||0)/Number(n.store))*100:0;
 const weeks=db.numbers.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-6);
 document.getElementById('dashboard').innerHTML=`
 <div class="card"><div class="row"><div><h2 style="margin-bottom:4px">Latest Store / Pro Performance</h2><div class="small">${n?'As of '+dateFmt(n.date):'Enter your first set of numbers'}</div></div><span class="pill">Pro Penetration ${pct(penetration)}</span></div>
 <div class="grid">
 ${metric('Store Sales',money(n?.store||0))}${metric('Store Plan',money(n?.storePlan||0))}${metric('Store Variance',money(variance(n?.store,n?.storePlan)),cls(variance(n?.store,n?.storePlan)))}
 ${metric('Pro Sales',money(n?.pro||0))}${metric('Pro Plan',money(n?.proPlan||0))}${metric('Pro Variance',money(variance(n?.pro,n?.proPlan)),cls(variance(n?.pro,n?.proPlan)))}
 ${metric('Pro Variance %',pct(variancePct(n?.pro,n?.proPlan)),cls(variancePct(n?.pro,n?.proPlan)))}${metric('Pro Credit',money(n?.credit||0))}${metric('Open / Overdue Actions',open+' / '+overdue,overdue?'bad':'')}
 </div></div>
 <div class="card"><h2>Accountability Command Center</h2><div class="grid">${metric('Active Associates',db.associates.filter(a=>a.status==='Active').length)}${metric('Needs Coaching',db.associates.filter(a=>a.status==='Needs Coaching').length,db.associates.some(a=>a.status==='Needs Coaching')?'bad':'good')}${metric('Open Associate Actions',db.actions.filter(a=>a.associateId&&a.status!=='Complete').length)}${metric('Overdue Actions',overdue,overdue?'bad':'good')}</div><div style="overflow:auto;margin-top:12px">${renderAssociateDashboard()}</div></div>
 <div class="card"><h2>Manager Focus</h2><div class="grid2"><div class="metric"><small>Trend</small><strong>${trendDirection()}</strong></div><div class="metric"><small>Recommended Focus</small><strong style="font-size:15px;line-height:1.35">${esc(autoOpportunity())}</strong></div></div></div>
 <div class="card"><h2>Pro Supervisor Command Scorecard</h2><div class="grid">
 ${metric('Pro Plan Attainment',proPlanAttainment(),scoreClass(proPlanAttainment()))}
 ${metric('Pro Penetration',pct(penetration),penetration>=10?'good':'watch')}
 ${metric('Action Completion',actionCompletion(),scoreClass(actionCompletion()))}
 ${metric('Follow-up Discipline',followUpDiscipline(),scoreClass(followUpDiscipline()))}
 ${metric('Associate Accountability',associateAccountability(),scoreClass(associateAccountability()))}
 ${metric('Specialist Attainment',specialistAttainment(),scoreClass(specialistAttainment()))}
 </div><div class="small" style="margin-top:10px">Use this scorecard to run the business: know the gap, assign the owner, set the due date, follow up, and verify the result.</div></div>
 <div class="card"><h2>Opportunity Pipeline</h2>${renderPipelineDashboard()}</div><div class="card"><h2>Today's Leadership Priorities</h2>${renderLeadershipPriorities()}</div>
 <div class="card"><h2>Quick Actions</h2><div class="actions">
 <button class="btn primary" onclick="go('numbers')">+ Enter Numbers</button><button class="btn primary" onclick="go('walks')">+ Daily Walk</button>
 <button class="btn primary" onclick="go('departments')">Departments</button><button class="btn primary" onclick="go('products')">Product Groups</button><button class="btn primary" onclick="go('actions')">Action Plan</button><button class="btn primary" onclick="go('specialists')">Specialists</button><button class="btn primary" onclick="go('associates')">Associates</button><button class="btn green" onclick="go('opportunities')">+ Opportunity</button><button class="btn green" onclick="addStarterDepartments()">Load Standard Departments</button><button class="btn green" onclick="makeBottomActions()">Auto-Create Bottom 5 Actions</button></div></div>
 <div class="grid2">
 <div class="card"><h2>Bottom Department Opportunities</h2>${depts.length?'<table><tr><th>Department</th><th>Variance</th><th>Pro Variance</th></tr>'+depts.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td class="${cls(variancePct(d.sales,d.plan))}">${money(variance(d.sales,d.plan))} (${pct(variancePct(d.sales,d.plan))})</td><td class="${cls(variancePct(d.pro,d.proPlan))}">${money(variance(d.pro,d.proPlan))}</td></tr>`).join('')+'</table>':'<div class="empty">Add department numbers to see opportunities.</div>'}</div>
 <div class="card"><h2>Bottom Product-Group Opportunities</h2>${products.length?'<table><tr><th>Product Group</th><th>Variance</th><th>Priority</th></tr>'+products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="${cls(variancePct(p.sales,p.plan))}">${money(variance(p.sales,p.plan))} (${pct(variancePct(p.sales,p.plan))})</td><td>${esc(p.priority)}</td></tr>`).join('')+'</table>':'<div class="empty">Add product-group numbers to see opportunities.</div>'}</div></div>
 <div class="card"><h2>Specialist Performance & Coaching</h2><div class="grid">${metric('Specialists',db.specialists.length)}${metric('Pipeline Owned',money(db.specialists.reduce((t,s)=>t+Number(s.pipelineOwned||0),0)))}${metric('Active Pipeline',money(db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)).reduce((t,o)=>t+Number(o.estimatedSales||0),0)))}${metric('Follow-ups Due',db.specialists.reduce((t,s)=>t+Number(s.followUpsDue||0),0),db.specialists.some(s=>Number(s.followUpsDue||0)>0)?'bad':'good')}</div><table style="margin-top:12px"><tr><th>Specialist</th><th>Sales vs Plan</th><th>Pipeline</th><th>Weighted</th><th>Follow-ups</th><th>Coaching Signal</th></tr>${db.specialists.slice().sort((a,b)=>variancePct(a.sales,a.plan)-variancePct(b.sales,b.plan)).map(s=>{const st=specialistPipelineStats(s);return `<tr><td><b>${esc(s.name)}</b></td><td class="${cls(variancePct(s.sales,s.plan))}">${money(variance(s.sales,s.plan))} (${pct(variancePct(s.sales,s.plan))})</td><td>${money(st.sales)}</td><td>${money(st.weighted)}</td><td class="${st.due?'bad':'good'}">${st.due}</td><td>${esc(specialistCoachingSignal(s))}</td></tr>`}).join('')}</table></div><div class="card"><h2>Specialist Scoreboard</h2>${specialists.length?'<table><tr><th>Rank</th><th>Specialist</th><th>Sales</th><th>Plan</th><th>Variance</th><th>Goal</th></tr>'+specialists.map((s,i)=>`<tr><td><b>#${i+1}</b></td><td>${esc(s.name)}</td><td>${money(s.sales)}</td><td>${money(s.plan)}</td><td class="${cls(variancePct(s.sales,s.plan))}">${money(variance(s.sales,s.plan))} (${pct(variancePct(s.sales,s.plan))})</td><td>${esc(s.goal)}</td></tr>`).join('')+'</table>':'<div class="empty">Add specialists to build the scoreboard.</div>'}</div>
 <div class="grid2">
 <div class="card"><h2>Pro Sales Trend</h2>${weeks.length?'<table><tr><th>Week</th><th>Pro Sales</th><th>Plan</th><th>Var %</th></tr>'+weeks.map(w=>`<tr><td>${dateFmt(w.date)}</td><td>${money(w.pro)}</td><td>${money(w.proPlan)}</td><td class="${cls(variancePct(w.pro,w.proPlan))}">${pct(variancePct(w.pro,w.proPlan))}</td></tr>`).join('')+'</table>':'<div class="empty">Enter multiple weeks to see your trend.</div>'}</div>
 <div class="card"><h2>Open Action Plans</h2>${open?'<table><tr><th>Opportunity</th><th>Owner</th><th>Due</th><th>Status</th></tr>'+db.actions.filter(a=>a.status!=='Complete').slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,8).map(a=>{let over=a.due&&a.due<dateToday();return `<tr><td><b>${esc(a.opportunity)}</b><div class="small">${esc(a.action)}</div></td><td>${esc(a.owner)}</td><td>${a.due?dateFmt(a.due):'—'}</td><td class="${statusClass(over?'Overdue':a.status)}">${over?'Overdue':esc(a.status)}</td></tr>`}).join('')+'</table>':'<div class="empty">No open action plans.</div>'}</div></div>`;
}
function renderAssociateDashboard(){const rows=db.associates.slice().sort((a,b)=>db.actions.filter(x=>x.associateId===b.id&&x.status!=='Complete').length-db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete').length);if(!rows.length)return '<div class="empty">Add associates to build the accountability dashboard.</div>';return '<table><tr><th>Associate</th><th>Department</th><th>Status</th><th>Walks</th><th>Open Actions</th><th>Overdue</th><th>Last Walk</th><th></th></tr>'+rows.map(a=>{const walks=db.walks.filter(w=>w.associateId===a.id).sort((x,y)=>y.date.localeCompare(x.date));const acts=db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete');const over=acts.filter(x=>x.due&&x.due<dateToday()).length;return '<tr><td><b>'+esc(a.name)+'</b></td><td>'+esc(a.department||'')+'</td><td>'+esc(a.status)+'</td><td>'+walks.length+'</td><td>'+acts.length+'</td><td class="'+(over?'bad':'good')+'">'+over+'</td><td>'+(walks.length?dateFmt(walks[0].date):'—')+'</td><td><button class="btn primary" onclick="viewAssociate(\''+a.id+'\')">View</button></td></tr>'}).join('')+'</table>';}
function viewAssociate(i){const a=db.associates.find(x=>x.id===i);if(!a)return;const walks=db.walks.filter(w=>w.associateId===i).sort((x,y)=>y.date.localeCompare(x.date));const acts=db.actions.filter(x=>x.associateId===i);const open=acts.filter(x=>x.status!=='Complete');const overdue=open.filter(x=>x.due&&x.due<dateToday());const complete=acts.filter(x=>x.status==='Complete');document.getElementById('dashboard').innerHTML='<div class="card"><div class="row"><div><h2>'+esc(a.name)+'</h2><div class="small">'+esc(a.department||'')+' · '+esc(a.role||'')+'</div></div><button class="btn gray" onclick="go(\'dashboard\')">Back to Dashboard</button></div><div class="grid" style="margin-top:14px">'+metric('Goal',esc(a.goal||'—'))+metric('Status',esc(a.status||'—'),a.status==='Needs Coaching'?'bad':'')+metric('Open Actions',open.length,open.length?'watch':'good')+metric('Overdue',overdue.length,overdue.length?'bad':'good')+'</div></div><div class="card"><h3>Accountability / Coaching Signal</h3><p>'+esc(a.notes||'No accountability notes recorded.')+'</p>'+((overdue.length||a.status==='Needs Coaching')?'<div class="metric bad"><small>Attention Needed</small><strong style="font-size:15px">Review overdue follow-ups and document the next coaching conversation.</strong></div>':'<div class="metric"><small>Current Signal</small><strong style="font-size:15px">On track — continue scheduled follow-up.</strong></div>')+'</div><div class="card"><h3>Open / Overdue Actions</h3>'+(open.length?'<table><tr><th>Status</th><th>Opportunity</th><th>Action</th><th>Due</th><th></th></tr>'+open.map(x=>{const over=x.due&&x.due<dateToday();return '<tr><td class="'+statusClass(over?'Overdue':x.status)+'"><b>'+(over?'Overdue':esc(x.status))+'</b></td><td>'+esc(x.opportunity)+'</td><td>'+esc(x.action)+'</td><td>'+(x.due?dateFmt(x.due):'—')+'</td><td><button class="btn gray" onclick="editAction(\''+x.id+'\')">Open</button></td></tr>'}).join('')+'</table>':'<div class="empty">No open actions.</div>')+'</div><div class="card"><h3>Walk History</h3>'+(walks.length?walks.map(w=>'<div class="card" style="box-shadow:none;margin:0 0 10px"><div class="row"><b>'+dateFmt(w.date)+'</b><span class="pill">'+esc(w.department||'')+'</span></div><p><b>Finding:</b> '+esc(w.result)+'</p><p><b>Opportunity:</b> '+esc(w.opportunity)+'</p><p><b>Action:</b> '+esc(w.action)+'</p><p><b>Follow-up:</b> '+esc(w.follow)+(w.followDue?' · Due '+dateFmt(w.followDue):'')+'</p>'+(w.photos?.length?'<div class="thumbs">'+w.photos.map(x=>'<img src="'+x+'">').join('')+'</div>':'')+'</div>').join(''):'<div class="empty">No walk history.</div>')+'</div><div class="card"><h3>Completed Actions</h3>'+(complete.length?'<table><tr><th>Opportunity</th><th>Action</th><th>Completed</th></tr>'+complete.map(x=>'<tr><td>'+esc(x.opportunity)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.due?dateFmt(x.due):'—')+'</td></tr>').join('')+'</table>':'<div class="empty">No completed actions yet.</div>')+'</div>';current='dashboard';nav();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='dashboard'));}function metric(a,b,c=''){return `<div class="metric"><small>${a}</small><strong class="${c}">${b}</strong></div>`}

function scoreClass(v){return v==='—'?'watch':Number(String(v).replace('%',''))>=90?'good':Number(String(v).replace('%',''))>=75?'watch':'bad'}
function proPlanAttainment(){const n=latest();if(!n||!n.proPlan)return '—';return pct((Number(n.pro||0)/Number(n.proPlan))*100)}
function actionCompletion(){if(!db.actions.length)return '—';return pct((db.actions.filter(a=>a.status==='Complete').length/db.actions.length)*100)}
function followUpDiscipline(){const due=db.actions.filter(a=>a.due);if(!due.length)return '—';const onTime=due.filter(a=>a.status==='Complete').length;return pct((onTime/due.length)*100)}
function associateAccountability(){if(!db.associates.length)return '—';const healthy=db.associates.filter(a=>{const open=db.actions.filter(x=>x.associateId===a.id&&x.status!=='Complete');const over=open.some(x=>x.due&&x.due<dateToday());return a.status!=='Needs Coaching'&&!over}).length;return pct((healthy/db.associates.length)*100)}
function specialistAttainment(){if(!db.specialists.length)return '—';const good=db.specialists.filter(s=>Number(s.plan)>0&&Number(s.sales)>=Number(s.plan)).length;return pct((good/db.specialists.length)*100)}

function trendDirection(){
 const w=db.numbers.slice().sort((a,b)=>a.date.localeCompare(b.date));
 if(w.length<2)return 'Not enough history';
 const a=w[w.length-2],b=w[w.length-1],d=variancePct(b.pro,b.proPlan)-variancePct(a.pro,a.proPlan);
 return d>0?'Improving':d<0?'Declining':'Flat';
}

  ...db.departments.slice().sort((a,b)=>variancePct(a.pro,a.proPlan)-variancePct(b.pro,b.proPlan)).filter(x=>variancePct(x.pro,x.proPlan)<0).slice(0,3).map(x=>({opp:x.name+' Pro sales recovery',action:x.notes||'Build a department partnership plan to increase Pro referrals and sales.',owner:'Pro Supervisor',due:dateToday(),status:'Open'}))

function renderCustomerTracker(){const rows=db.opportunities.slice();const customers={};rows.forEach(o=>{const k=o.company||o.customer||'Unknown';if(!customers[k])customers[k]={name:k,open:0,won:0,lost:0,sales:0,pipeline:0,weighted:0,follow:0,last:''};if(o.stage==='Won'){customers[k].won++;customers[k].sales+=Number(o.estimatedSales||0)}else if(o.stage==='Lost'){customers[k].lost++}else{customers[k].open++;customers[k].pipeline+=Number(o.estimatedSales||0);customers[k].weighted+=Number(o.estimatedSales||0)*(Number(o.probability||0)/100)}if(o.nextFollowUp&&o.nextFollowUp<=dateToday()&&!['Won','Lost'].includes(o.stage))customers[k].follow++;if(o.date&&(!customers[k].last||o.date>customers[k].last))customers[k].last=o.date});const list=Object.values(customers).map(x=>{let score=100;if(x.follow)score-=35;if(x.open===0)score-=15;if(x.pipeline===0&&x.sales===0)score-=20;if(x.last){const age=Math.floor((new Date(dateToday())-new Date(x.last))/86400000);if(age>30)score-=15;if(age>60)score-=15}x.health=Math.max(0,score);x.priority=x.follow?'Immediate Follow-up':x.health<60?'Re-engage':x.pipeline>=5000?'Growth':'Maintain';return x}).sort((a,b)=>a.health-b.health||b.pipeline-a.pipeline);const avg=list.length?list.reduce((t,x)=>t+x.health,0)/list.length:0;const atRisk=list.filter(x=>x.health<60).length;const due=list.reduce((t,x)=>t+x.follow,0);return '<div class="card"><div class="row"><div><h2>Contractor & Customer Relationship Center</h2><p class="small">Automatically scores account health from pipeline activity, follow-up discipline and recency. Use it to decide who needs your attention first.</p></div><button class="btn green" onclick="go(\'opportunities\')">+ Add Opportunity</button></div><div class="grid">'+metric('Accounts',list.length)+metric('Average Health',avg.toFixed(0)+'/100',avg>=75?'good':avg>=60?'watch':'bad')+metric('At-Risk Accounts',atRisk,atRisk?'bad':'good')+metric('Follow-ups Due',due,due?'bad':'good')+metric('Customer Pipeline',money(list.reduce((t,x)=>t+x.pipeline,0)))+metric('Weighted Pipeline',money(list.reduce((t,x)=>t+x.weighted,0)))+'</div></div><div class="card"><h2>Account Health</h2><table><tr><th>Customer / Company</th><th>Health</th><th>Open Opps</th><th>Pipeline</th><th>Weighted</th><th>Won Sales</th><th>Last Activity</th><th>Follow-ups</th><th>Priority</th></tr>'+(list.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td class="'+(x.health<60?'bad':x.health<75?'watch':'good')+'"><b>'+x.health+'</b>/100</td><td>'+x.open+'</td><td>'+money(x.pipeline)+'</td><td>'+money(x.weighted)+'</td><td>'+money(x.sales)+'</td><td>'+(x.last?dateFmt(x.last):'—')+'</td><td class="'+(x.follow?'bad':'')+'">'+x.follow+'</td><td><b>'+x.priority+'</b></td></tr>').join('')||'<tr><td colspan="9">Add opportunities to begin building your customer relationship center.</td></tr>')+'</table><div class="small" style="margin-top:10px">Health is a management signal, not a customer rating: it prioritizes follow-up and growth work using information already entered in the Command Center.</div></div>'}
function quoteCompliance(o){const text=((o.notes||'')+' '+(o.source||'')).toLowerCase();const flags=[];if(!o.estimatedSales||Number(o.estimatedSales)<=0)flags.push('Missing sales value');if(!o.owner)flags.push('No owner');if(!o.nextFollowUp&&o.stage!=='Won'&&o.stage!=='Lost')flags.push('No follow-up date');if(o.stage==='Quoted'&&Number(o.probability||0)<25)flags.push('Low confidence');if(/copy|copied|duplicate|duplicat/.test(text))flags.push('Review for duplicate/copy activity');if(/competitor/.test(text)&&!/quote|pricing|price/.test(text))flags.push('Review competitor documentation');return flags}
function renderQuoteTracker(){const quotes=db.opportunities.filter(o=>o.type==='Quote');const active=quotes.filter(o=>!['Won','Lost'].includes(o.stage));const won=quotes.filter(o=>o.stage==='Won'),lost=quotes.filter(o=>o.stage==='Lost');const quoted=quotes.reduce((t,o)=>t+Number(o.estimatedSales||0),0),wonSales=won.reduce((t,o)=>t+Number(o.estimatedSales||0),0);const winRate=won.length+lost.length?won.length/(won.length+lost.length)*100:0;const flags=quotes.map(o=>({o,flags:quoteCompliance(o)})).filter(x=>x.flags.length);const due=active.filter(o=>o.nextFollowUp&&o.nextFollowUp<=dateToday()).length;return '<div class="card"><div class="row"><div><h2>Quote & MVD Compliance Center</h2><p class="small">Track quote performance while flagging records that need documentation or process review. This is a management aid—not a substitute for current Lowe\'s policy.</p></div><button class="btn green" onclick="go(\'opportunities\')">+ Add Quote</button></div><div class="grid">'+metric('Quotes',quotes.length)+metric('Active Quotes',active.length)+metric('Quoted Sales',money(quoted))+metric('Won Quote Sales',money(wonSales))+metric('Win Rate',winRate.toFixed(0)+'%',winRate>=30?'good':'watch')+metric('Compliance Flags',flags.length,flags.length?'bad':'good')+metric('Follow-ups Due',due,due?'watch':'good')+'</div></div><div class="card"><h2>MVD / Quote Guardrails</h2><div class="grid2"><div><h3>Before submitting</h3><ul><li>Confirm customer/project and expected sales value.</li><li>Use the appropriate pricing/MVD process for the situation.</li><li>Document relevant competitor/pricing information when applicable.</li><li>Do not repeatedly copy quotes to chase better pricing.</li></ul></div><div><h3>Protect the business</h3><ul><li>Keep one clear owner for each quote.</li><li>Set a follow-up date.</li><li>Document the outcome and next step.</li><li>Review duplicate/copy warnings before submitting another quote.</li></ul></div></div></div><div class="card"><h2>Quotes Requiring Review</h2>'+(flags.length?'<table><tr><th>Customer</th><th>Sales</th><th>Stage</th><th>Owner</th><th>Follow-up</th><th>Flags</th><th>Action</th></tr>'+flags.map(x=>'<tr><td><b>'+esc(x.o.customer||x.o.company||'Quote')+'</b></td><td>'+money(x.o.estimatedSales||0)+'</td><td>'+esc(x.o.stage)+'</td><td>'+esc(x.o.owner||'Unassigned')+'</td><td>'+((x.o.nextFollowUp?dateFmt(x.o.nextFollowUp):'—'))+'</td><td class="bad">'+x.flags.map(esc).join('<br>')+'</td><td><button class="btn green" onclick="createOpportunityAction(\''+x.o.id+'\')">Create Action</button></td></tr>').join('')+'</table>':'<div class="notice">No quote compliance flags detected from the information currently entered.</div>')+'</div><div class="card"><h2>Quote Performance</h2>'+(quotes.length?'<table><tr><th>Customer</th><th>Sales</th><th>Stage</th><th>Probability</th><th>Follow-up</th><th>Owner</th><th>Status</th></tr>'+quotes.slice().sort((a,b)=>Number(b.estimatedSales||0)-Number(a.estimatedSales||0)).map(o=>{const f=quoteCompliance(o);return '<tr><td><b>'+esc(o.customer||o.company||'Quote')+'</b></td><td>'+money(o.estimatedSales||0)+'</td><td>'+esc(o.stage)+'</td><td>'+Number(o.probability||0)+'%</td><td class="'+(o.nextFollowUp&&o.nextFollowUp<=dateToday()&&o.stage!=='Won'&&o.stage!=='Lost'?'bad':'')+'">'+(o.nextFollowUp?dateFmt(o.nextFollowUp):'—')+'</td><td>'+esc(o.owner||'')+'</td><td class="'+(f.length?'bad':'good')+'">'+(f.length?f.length+' review item(s)':'Ready')+'</td></tr>'}).join('')+'</table>':'<div class="small">Add Quote opportunities to begin measuring quote conversion and compliance.</div>')+'</div>'}
function renderCreditTracker(){const opp=db.opportunities.filter(o=>o.type==='Credit');const won=opp.filter(o=>o.stage==='Won');const active=opp.filter(o=>!['Won','Lost'].includes(o.stage));const sales=opp.reduce((t,o)=>t+Number(o.estimatedSales||0),0),wonSales=won.reduce((t,o)=>t+Number(o.estimatedSales||0),0);const due=active.filter(o=>o.nextFollowUp&&o.nextFollowUp<=dateToday()).length;return '<div class="card"><h2>Pro Credit Growth</h2><p class="small">Track credit opportunities, follow-up and sales tied to Pro credit activity.</p><div class="grid">'+metric('Credit Opportunities',opp.length)+metric('Active Credit Opps',active.length)+metric('Potential Sales',money(sales))+metric('Won Sales',money(wonSales))+metric('Follow-ups Due',due,due?'watch':'good')+'</div><table style="margin-top:12px"><tr><th>Customer</th><th>Sales Potential</th><th>Stage</th><th>Owner</th><th>Follow-up</th><th>Action</th></tr>'+(opp.slice().sort((a,b)=>Number(b.estimatedSales||0)-Number(a.estimatedSales||0)).map(o=>'<tr><td><b>'+esc(o.customer||o.company||'Credit Opportunity')+'</b></td><td>'+money(o.estimatedSales||0)+'</td><td>'+esc(o.stage)+'</td><td>'+esc(o.owner||'')+'</td><td>'+(o.nextFollowUp?dateFmt(o.nextFollowUp):'—')+'</td><td><button class="btn gray" onclick="createOpportunityAction(\''+o.id+'\')">Create Action</button></td></tr>').join('')||'<tr><td colspan="6">Add Credit opportunities in the Opportunities tab to start tracking.</td></tr>')+'</table></div>'}

}

function renderCustomerTracker(){const rows=db.opportunities.slice();const customers={};rows.forEach(o=>{const k=o.company||o.customer||'Unknown';if(!customers[k])customers[k]={name:k,open:0,won:0,lost:0,sales:0,pipeline:0,weighted:0,follow:0,last:''};if(o.stage==='Won'){customers[k].won++;customers[k].sales+=Number(o.estimatedSales||0)}else if(o.stage==='Lost'){customers[k].lost++}else{customers[k].open++;customers[k].pipeline+=Number(o.estimatedSales||0);customers[k].weighted+=Number(o.estimatedSales||0)*(Number(o.probability||0)/100)}if(o.nextFollowUp&&o.nextFollowUp<=dateToday()&&!['Won','Lost'].includes(o.stage))customers[k].follow++;if(o.date&&(!customers[k].last||o.date>customers[k].last))customers[k].last=o.date});const list=Object.values(customers).map(x=>{let score=100;if(x.follow)score-=35;if(x.open===0)score-=15;if(x.pipeline===0&&x.sales===0)score-=20;if(x.last){const age=Math.floor((new Date(dateToday())-new Date(x.last))/86400000);if(age>30)score-=15;if(age>60)score-=15}x.health=Math.max(0,score);x.priority=x.follow?'Immediate Follow-up':x.health<60?'Re-engage':x.pipeline>=5000?'Growth':'Maintain';return x}).sort((a,b)=>a.health-b.health||b.pipeline-a.pipeline);const avg=list.length?list.reduce((t,x)=>t+x.health,0)/list.length:0;const atRisk=list.filter(x=>x.health<60).length;const due=list.reduce((t,x)=>t+x.follow,0);return '<div class="card"><div class="row"><div><h2>Contractor & Customer Relationship Center</h2><p class="small">Automatically scores account health from pipeline activity, follow-up discipline and recency. Use it to decide who needs your attention first.</p></div><button class="btn green" onclick="go(\'opportunities\')">+ Add Opportunity</button></div><div class="grid">'+metric('Accounts',list.length)+metric('Average Health',avg.toFixed(0)+'/100',avg>=75?'good':avg>=60?'watch':'bad')+metric('At-Risk Accounts',atRisk,atRisk?'bad':'good')+metric('Follow-ups Due',due,due?'bad':'good')+metric('Customer Pipeline',money(list.reduce((t,x)=>t+x.pipeline,0)))+metric('Weighted Pipeline',money(list.reduce((t,x)=>t+x.weighted,0)))+'</div></div><div class="card"><h2>Account Health</h2><table><tr><th>Customer / Company</th><th>Health</th><th>Open Opps</th><th>Pipeline</th><th>Weighted</th><th>Won Sales</th><th>Last Activity</th><th>Follow-ups</th><th>Priority</th></tr>'+(list.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td class="'+(x.health<60?'bad':x.health<75?'watch':'good')+'"><b>'+x.health+'</b>/100</td><td>'+x.open+'</td><td>'+money(x.pipeline)+'</td><td>'+money(x.weighted)+'</td><td>'+money(x.sales)+'</td><td>'+(x.last?dateFmt(x.last):'—')+'</td><td class="'+(x.follow?'bad':'')+'">'+x.follow+'</td><td><b>'+x.priority+'</b></td></tr>').join('')||'<tr><td colspan="9">Add opportunities to begin building your customer relationship center.</td></tr>')+'</table><div class="small" style="margin-top:10px">Health is a management signal, not a customer rating: it prioritizes follow-up and growth work using information already entered in the Command Center.</div></div>'}
function quoteCompliance(o){const text=((o.notes||'')+' '+(o.source||'')).toLowerCase();const flags=[];if(!o.estimatedSales||Number(o.estimatedSales)<=0)flags.push('Missing sales value');if(!o.owner)flags.push('No owner');if(!o.nextFollowUp&&o.stage!=='Won'&&o.stage!=='Lost')flags.push('No follow-up date');if(o.stage==='Quoted'&&Number(o.probability||0)<25)flags.push('Low confidence');if(/copy|copied|duplicate|duplicat/.test(text))flags.push('Review for duplicate/copy activity');if(/competitor/.test(text)&&!/quote|pricing|price/.test(text))flags.push('Review competitor documentation');return flags}
function renderQuoteTracker(){const quotes=db.opportunities.filter(o=>o.type==='Quote');const active=quotes.filter(o=>!['Won','Lost'].includes(o.stage));const won=quotes.filter(o=>o.stage==='Won'),lost=quotes.filter(o=>o.stage==='Lost');const quoted=quotes.reduce((t,o)=>t+Number(o.estimatedSales||0),0),wonSales=won.reduce((t,o)=>t+Number(o.estimatedSales||0),0);const winRate=won.length+lost.length?won.length/(won.length+lost.length)*100:0;const flags=quotes.map(o=>({o,flags:quoteCompliance(o)})).filter(x=>x.flags.length);const due=active.filter(o=>o.nextFollowUp&&o.nextFollowUp<=dateToday()).length;return '<div class="card"><div class="row"><div><h2>Quote & MVD Compliance Center</h2><p class="small">Track quote performance while flagging records that need documentation or process review. This is a management aid—not a substitute for current Lowe\'s policy.</p></div><button class="btn green" onclick="go(\'opportunities\')">+ Add Quote</button></div><div class="grid">'+metric('Quotes',quotes.length)+metric('Active Quotes',active.length)+metric('Quoted Sales',money(quoted))+metric('Won Quote Sales',money(wonSales))+metric('Win Rate',winRate.toFixed(0)+'%',winRate>=30?'good':'watch')+metric('Compliance Flags',flags.length,flags.length?'bad':'good')+metric('Follow-ups Due',due,due?'watch':'good')+'</div></div><div class="card"><h2>MVD / Quote Guardrails</h2><div class="grid2"><div><h3>Before submitting</h3><ul><li>Confirm customer/project and expected sales value.</li><li>Use the appropriate pricing/MVD process for the situation.</li><li>Document relevant competitor/pricing information when applicable.</li><li>Do not repeatedly copy quotes to chase better pricing.</li></ul></div><div><h3>Protect the business</h3><ul><li>Keep one clear owner for each quote.</li><li>Set a follow-up date.</li><li>Document the outcome and next step.</li><li>Review duplicate/copy warnings before submitting another quote.</li></ul></div></div></div><div class="card"><h2>Quotes Requiring Review</h2>'+(flags.length?'<table><tr><th>Customer</th><th>Sales</th><th>Stage</th><th>Owner</th><th>Follow-up</th><th>Flags</th><th>Action</th></tr>'+flags.map(x=>'<tr><td><b>'+esc(x.o.customer||x.o.company||'Quote')+'</b></td><td>'+money(x.o.estimatedSales||0)+'</td><td>'+esc(x.o.stage)+'</td><td>'+esc(x.o.owner||'Unassigned')+'</td><td>'+((x.o.nextFollowUp?dateFmt(x.o.nextFollowUp):'—'))+'</td><td class="bad">'+x.flags.map(esc).join('<br>')+'</td><td><button class="btn green" onclick="createOpportunityAction(\''+x.o.id+'\')">Create Action</button></td></tr>').join('')+'</table>':'<div class="notice">No quote compliance flags detected from the information currently entered.</div>')+'</div><div class="card"><h2>Quote Performance</h2>'+(quotes.length?'<table><tr><th>Customer</th><th>Sales</th><th>Stage</th><th>Probability</th><th>Follow-up</th><th>Owner</th><th>Status</th></tr>'+quotes.slice().sort((a,b)=>Number(b.estimatedSales||0)-Number(a.estimatedSales||0)).map(o=>{const f=quoteCompliance(o);return '<tr><td><b>'+esc(o.customer||o.company||'Quote')+'</b></td><td>'+money(o.estimatedSales||0)+'</td><td>'+esc(o.stage)+'</td><td>'+Number(o.probability||0)+'%</td><td class="'+(o.nextFollowUp&&o.nextFollowUp<=dateToday()&&o.stage!=='Won'&&o.stage!=='Lost'?'bad':'')+'">'+(o.nextFollowUp?dateFmt(o.nextFollowUp):'—')+'</td><td>'+esc(o.owner||'')+'</td><td class="'+(f.length?'bad':'good')+'">'+(f.length?f.length+' review item(s)':'Ready')+'</td></tr>'}).join('')+'</table>':'<div class="small">Add Quote opportunities to begin measuring quote conversion and compliance.</div>')+'</div>'}
function renderCreditTracker(){const opp=db.opportunities.filter(o=>o.type==='Credit');const won=opp.filter(o=>o.stage==='Won');const active=opp.filter(o=>!['Won','Lost'].includes(o.stage));const sales=opp.reduce((t,o)=>t+Number(o.estimatedSales||0),0),wonSales=won.reduce((t,o)=>t+Number(o.estimatedSales||0),0);const due=active.filter(o=>o.nextFollowUp&&o.nextFollowUp<=dateToday()).length;return '<div class="card"><h2>Pro Credit Growth</h2><p class="small">Track credit opportunities, follow-up and sales tied to Pro credit activity.</p><div class="grid">'+metric('Credit Opportunities',opp.length)+metric('Active Credit Opps',active.length)+metric('Potential Sales',money(sales))+metric('Won Sales',money(wonSales))+metric('Follow-ups Due',due,due?'watch':'good')+'</div><table style="margin-top:12px"><tr><th>Customer</th><th>Sales Potential</th><th>Stage</th><th>Owner</th><th>Follow-up</th><th>Action</th></tr>'+(opp.slice().sort((a,b)=>Number(b.estimatedSales||0)-Number(a.estimatedSales||0)).map(o=>'<tr><td><b>'+esc(o.customer||o.company||'Credit Opportunity')+'</b></td><td>'+money(o.estimatedSales||0)+'</td><td>'+esc(o.stage)+'</td><td>'+esc(o.owner||'')+'</td><td>'+(o.nextFollowUp?dateFmt(o.nextFollowUp):'—')+'</td><td><button class="btn gray" onclick="createOpportunityAction(\''+o.id+'\')">Create Action</button></td></tr>').join('')||'<tr><td colspan="6">Add Credit opportunities in the Opportunities tab to start tracking.</td></tr>')+'</table></div>'}

async function saveWalk(createAction=false){

 if(createAction){
  if(!w.associateId){alert('Select an associate before creating an action.');return}
  if(!w.opportunity&&!w.action){alert('Enter an opportunity or action before creating an action plan.');return}
 }
 upsert('walks',w);
 if(createAction){
  const existing=db.actions.find(a=>a.source==='Daily Walk'&&a.sourceId===w.id);

  if(existing){Object.assign(existing,action)}else db.actions.push(action);
 }
 edit={};save();go(createAction?'actions':'walks')
}

 document.getElementById('services').innerHTML='<div class="card"><div class="row"><div><h2>Services & Install Tracker</h2><p class="small">Turn project and install opportunities into a managed pipeline with clear follow-up and ownership.</p></div><button class="btn green" onclick="go(\'opportunities\')">+ Add Service / Install Opportunity</button></div><div class="grid">'+metric('Active Projects',active.length)+metric('Open Pipeline',money(pipeline))+metric('Weighted Pipeline',money(weighted))+metric('Won / Install Sales',money(wonSales))+metric('Follow-ups Due',due,due?'watch':'good')+metric('Overdue Follow-ups',overdue,overdue?'bad':'good')+'</div></div><div class="card"><h2>Execution Pipeline</h2>'+(rows.length?'<table><tr><th>Customer / Project</th><th>Type</th><th>Stage</th><th>Sales</th><th>Probability</th><th>Follow-up</th><th>Owner</th><th></th></tr>'+rows.slice().sort((a,b)=>Number(b.estimatedSales||0)-Number(a.estimatedSales||0)).map(o=>{const over=!['Won','Lost'].includes(o.stage)&&o.nextFollowUp&&o.nextFollowUp<dateToday();return '<tr><td><b>'+esc(o.customer||o.company||'Project')+'</b><div class="small">'+esc(o.company||'')+'</div><div class="small">'+esc(o.notes||'')+'</div></td><td>'+esc(o.type)+'</td><td>'+esc(o.stage)+'</td><td>'+money(o.estimatedSales||0)+'</td><td>'+Number(o.probability||0)+'%</td><td class="'+(over?'bad':'')+'">'+(o.nextFollowUp?dateFmt(o.nextFollowUp):'—')+(over?' · OVERDUE':'')+'</td><td>'+esc(o.owner||'Unassigned')+'</td><td><button class="btn green" onclick="createOpportunityAction(\''+o.id+'\')">Create Action</button> <button class="btn gray" onclick="editOpportunity(\''+o.id+'\')">Edit</button></td></tr>'}).join('')+'</table>':'<div class="empty">No project, service, or install opportunities yet. Add them from the Opportunities tab.</div>')+'</div><div class="card"><h2>Service / Install Leadership Focus</h2><div class="grid2"><div class="metric"><small>Largest Active Project</small><strong style="font-size:16px">'+esc(active.slice().sort((a,b)=>Number(b.estimatedSales||0)-Number(a.estimatedSales||0))[0]?.customer||'None')+'</strong></div><div class="metric"><small>Next Management Move</small><strong style="font-size:16px">'+(overdue?'Clear overdue customer follow-ups first.':due?'Complete today’s project follow-ups.':'Build new project / install opportunities from Pro conversations.')+'</strong></div></div></div>';
}

 if(edit.d){renderDeliveryForm();return}

metric"><small>After Delivery</small><strong style="font-size:15px">Close the record, confirm completion and create a follow-up action for any issue.</strong></div><div class="metric"><small>Leadership Focus</small><strong style="font-size:15px">'+(overdue?'Resolve overdue deliveries first.':ready?'Confirm ready-to-execute deliveries.':'Build clean handoffs from sales to execution.')+'</strong></div></div></div>';
}
function newDelivery(){edit={};go('deliveries')}
function renderDeliveryForm(){
 const d=edit.d||{};
 document.getElementById('deliveries').innerHTML='<div class="card"><div class="row"><h2>'+(edit.d?'Edit':'New')+' Delivery / Execution Record</h2><button class="btn gray" onclick="go(\'deliveries\')">Back</button></div><div class="grid2"><label>Customer / Contractor<input id="d_customer" value="'+esc(d.customer||'')+'"></label><label>Company / Account<input id="d_company" value="'+esc(d.company||'')+'"></label><label>Date<input id="d_date" type="date" value="'+(d.date||dateToday())+'"></label><label>Type<select id="d_type">'+['Delivery','Flatbed','Pickup','Install Handoff','Service'].map(x=>'<option '+(d.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Status<select id="d_status">'+['Scheduled','Ready','In Transit','Delivered','Issue','Complete','Cancelled'].map(x=>'<option '+(d.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Sales Value<input id="d_sales" type="number" step=".01" value="'+(d.sales??'')+'"></label><label>Owner<input id="d_owner" value="'+esc(d.owner||'')+'"></label><label>Related Opportunity ID<input id="d_opp" value="'+esc(d.opportunityId||'')+'"></label><label><input id="d_kickers" type="checkbox" '+(d.kickers?'checked':'')+'> Flatbed: material positioned to edge of kickers</label><label><input id="d_secured" type="checkbox" '+(d.secured?'checked':'')+'> Loose ends / load secured</label><label><input id="d_ticket" type="checkbox" '+(d.loadingTicket?'checked':'')+'> Loading ticket printed before loading</label><label>Issue / Exception<textarea id="d_issue">'+esc(d.issue||'')+'</textarea></label><label>Notes<textarea id="d_notes">'+esc(d.notes||'')+'</textarea></label></div><div class="actions"><button class="btn primary" onclick="saveDelivery()">Save Delivery</button><button class="btn gray" onclick="go(\'deliveries\')">Cancel</button></div></div>';
}
function editDelivery(i){edit.d=db.deliveries.find(x=>x.id===i);renderDeliveryForm()}
function saveDelivery(){const d={id:edit.d?.id||id(),customer:v('d_customer'),company:v('d_company'),date:v('d_date'),type:v('d_type'),status:v('d_status'),sales:+v('d_sales'),owner:v('d_owner'),opportunityId:v('d_opp'),issue:v('d_issue'),notes:v('d_notes'),kickers:document.getElementById('d_kickers')?.checked||false,secured:document.getElementById('d_secured')?.checked||false,loadingTicket:document.getElementById('d_ticket')?.checked||false};if(!d.customer&&!d.company){alert('Enter a customer or company.');return}upsert('deliveries',d);edit={};go('deliveries')}
function renderOperatingRhythm(){
 const today=dateToday(),dow=new Date(today+'T00:00:00').getDay(),day=dow===0?7:dow;
 const n=latest(),gap=n?variance(n.pro,n.proPlan):0;
 const overdue=db.actions.filter(a=>a.status!=='Complete'&&a.due&&a.due<today),follow=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)&&o.nextFollowUp&&o.nextFollowUp<=today),coach=db.associates.filter(a=>a.status==='Needs Coaching'),below=db.specialists.filter(s=>variance(s.sales,s.plan)<0),deliveryFlags=db.deliveries.filter(d=>d.status!=='Complete'&&d.status!=='Cancelled'&&deliveryCompliance(d).length);
 const plans={1:['Monday — Business Plan','Set the week before the week sets you.',['Review Pro sales vs plan and identify the dollar gap.','Review specialists below plan and assign recovery commitments.','Review top customer pipeline and follow-ups.','Identify bottom departments/product groups and assign actions.']],2:['Tuesday — Customer & Pipeline','Create and advance business.',['Work top contractor/customer opportunities.','Complete quote and MVD follow-ups.','Review install/services pipeline.','Add new opportunities from Pro conversations.']],3:['Wednesday — Team Accountability','Coach the behaviors that drive the number.',['Review associate actions and daily walks.','Coach associates needing attention.','Review specialist pipeline and commitments.','Recognize a win and document the behavior to repeat.']],4:['Thursday — Execution','Make sure the business you sold can actually execute.',['Review delivery readiness and compliance flags.','Review flatbed/loading standards.','Resolve open service/install issues.','Close or escalate overdue actions.']],5:['Friday — Results & Recovery','Finish the week with facts and a plan.',['Review Pro sales result and gap to plan.','Review wins and customer growth.','Close completed actions and document results.','Build next week’s top priorities.']]};
 const plan=plans[day]||['Weekend — Field Focus','Stay close to the customer and execution.',['Review active opportunities and follow-ups.','Capture meaningful Pro walk observations.','Address urgent delivery/customer issues.']];
 return '<div class="card"><div class="row"><div><h2>Pro Supervisor Operating Rhythm</h2><p class="small">'+esc(plan[1])+' · '+dateFmt(today)+'</p></div><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="grid">'+metric('Pro Gap',money(gap),gap<0?'bad':'good')+metric('Overdue Actions',overdue.length,overdue.length?'bad':'good')+metric('Follow-ups Due',follow.length,follow.length?'watch':'good')+metric('Specialists Below Plan',below.length,below.length?'watch':'good')+metric('Associates to Coach',coach.length,coach.length?'watch':'good')+metric('Delivery Flags',deliveryFlags.length,deliveryFlags.length?'bad':'good')+'</div></div><div class="card"><h2>'+plan[0]+'</h2><ol class="priority-list">'+plan[2].map(t=>'<li><b>'+esc(t)+'</b></li>').join('')+'</ol></div><div class="card"><h2>Today’s Command Center Check</h2><table><tr><th>Area</th><th>Current Signal</th><th>Next Move</th></tr><tr><td>Pro Results</td><td class="'+(gap<0?'bad':'good')+'">'+(gap<0?money(Math.abs(gap))+' below plan':'At / above plan')+'</td><td>Review Numbers and assign recovery if needed.</td></tr><tr><td>Actions</td><td class="'+(overdue.length?'bad':'good')+'">'+overdue.length+' overdue</td><td>Open Action Plans and close or reassign.</td></tr><tr><td>Pipeline</td><td class="'+(follow.length?'watch':'good')+'">'+follow.length+' follow-ups due</td><td>Work Opportunities and document next commitments.</td></tr><tr><td>Team</td><td class="'+(coach.length||below.length?'watch':'good')+'">'+coach.length+' coaching · '+below.length+' specialists below plan</td><td>Review Associates and Specialists.</td></tr><tr><td>Execution</td><td class="'+(deliveryFlags.length?'bad':'good')+'">'+deliveryFlags.length+' delivery flags</td><td>Review Delivery & Execution before issues reach the customer.</td></tr></table></div>'
}function renderSettings(){
 document.getElementById('settings').innerHTML=`<div class="card"><h2>Backup / Restore</h2><p class="small">Your records are stored in this browser. Export a backup before changing computers or browsers.</p>
 <div class="actions"><button class="btn primary" onclick="exportData()">Export Backup</button><label class="btn gray" style="display:inline-block;cursor:pointer">Restore Backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreData(this)"></label><button class="btn red" onclick="clearAll()">Clear All Data</button></div></div>
 <div class="card"><h2>Current Record Counts</h2><div class="grid">${metric('Numbers',db.numbers.length)}${metric('Specialists',db.specialists.length)}${metric('Departments',db.departments.length)}${metric('Product Groups',db.products.length)}${metric('Associates',db.associates.length)}${metric('Actions',db.actions.length)}${metric('Daily Walks',db.walks.length)}${metric('Opportunities',db.opportunities.length)+metric('Deliveries',db.deliveries.length)+metric('Recognition Wins',db.wins?.length||0)+metric('Coaching Records',db.coaching?.length||0)}</div></div>`;
}function previewPhotoCapture(e){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=function(){photoCaptureData=rd.result;const p=document.getElementById('pc_preview');if(p)p.innerHTML='<img src="'+photoCaptureData+'" style="max-width:100%;max-height:260px;border-radius:10px">'};rd.readAsDataURL(f)}
function savePhotoCapture(){
 const w={id:id(),date:v('pc_date')||dateToday(),owner:v('pc_owner'),associateId:v('pc_associate'),department:v('pc_department'),result:v('pc_finding'),opportunity:v('pc_opp'),action:v('pc_action'),followUp:v('pc_action'),followUpDue:v('pc_due'),photos:photoCaptureData?[photoCaptureData]:[]};
 if(!w.result&&!w.opportunity&&!w.action&&!w.photos.length){alert('Add a photo or observation.');return}
 db.walks.push(w);
 if(w.opportunity||w.action)db.actions.push({id:id(),result:w.result,opportunity:w.opportunity,action:w.action,owner:w.owner,goal:w.action,due:w.followUpDue,status:'Open',source:'Photo Evidence',sourceId:w.id,associateId:w.associateId});
 save();photoCaptureData='';go('photos')
}function renderQuickEntry(){
 const today=dateToday(), associates=db.associates||[], specialists=db.specialists||[], departments=db.departments||[];
 return '<div class="card"><h2>Quick Entry Center</h2><p class="small">Enter a field observation once, then create the follow-up work from the same screen.</p><div class="grid"><div class="card"><h3>Daily Observation</h3><label>Date</label><input id="qe_date" type="date" value="'+today+'"><label>Associate</label><select id="qe_associate"><option value="">Select associate</option>'+associates.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select><label>Department</label><select id="qe_department"><option value="">Select department</option>'+departments.map(d=>'<option>'+esc(d.name)+'</option>').join('')+'</select><label>Finding / Result</label><textarea id="qe_result" placeholder="What did you see?"></textarea><label>Opportunity</label><textarea id="qe_opp" placeholder="What is the opportunity?"></textarea><label>Action / Goal</label><textarea id="qe_action" placeholder="What needs to happen?"></textarea><label>Owner</label><input id="qe_owner" placeholder="Owner"><label>Follow-up Due</label><input id="qe_due" type="date" value="'+today+'"><button class="btn primary" onclick="quickSaveObservation()">Save Observation + Action</button></div><div class="card"><h3>Specialist Check-In</h3><label>Specialist</label><select id="qe_specialist"><option value="">Select specialist</option>'+specialists.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><label>Priority / Commitment</label><textarea id="qe_priority" placeholder="What is the specialist committing to?"></textarea><label>Pipeline Owned $</label><input id="qe_pipeline" type="number" min="0" value="0"><label>Follow-ups Due</label><input id="qe_followups" type="number" min="0" value="0"><button class="btn primary" onclick="quickSaveSpecialist()">Save Specialist Check-In</button></div></div></div>'
}function quickSaveObservation(){
 const w={id:id(),date:v('qe_date')||dateToday(),owner:v('qe_owner'),associateId:v('qe_associate'),department:v('qe_department'),result:v('qe_result'),opportunity:v('qe_opp'),action:v('qe_action'),followUp:v('qe_action'),followUpDue:v('qe_due'),photos:[]};
 if(!w.result&&!w.opportunity&&!w.action){alert('Enter a finding, opportunity, or action.');return}
 db.walks.push(w);
 if(w.opportunity||w.action)db.actions.push({id:id(),result:w.result,opportunity:w.opportunity,action:w.action,owner:w.owner,goal:w.action,due:w.followUpDue,status:'Open',source:'Quick Entry',sourceId:w.id,associateId:w.associateId});
 save();go('walks')
}
function quickSaveSpecialist(){
 const s=db.specialists.find(x=>x.id===v('qe_specialist')); if(!s){alert('Select a specialist.');return}
 s.pipelineOwned=Number(v('qe_pipeline')||0);s.followUpsDue=Number(v('qe_followups')||0);s.nextPriority=v('qe_priority');
 save();go('specialists')
}function renderWeeklyCommandBoard(){
 const today=dateToday(),start=startOfWeek(today),end=new Date(start+'T00:00:00');end.setDate(end.getDate()+6);
 const endDate=end.toISOString().slice(0,10),weekActions=db.actions.filter(a=>a.due>=start&&a.due<=endDate),open=weekActions.filter(a=>a.status!=='Complete'),done=weekActions.filter(a=>a.status==='Complete'),overdue=db.actions.filter(a=>a.status!=='Complete'&&a.due&&a.due<today),follow=db.opportunities.filter(o=>!['Won','Lost'].includes(o.stage)&&o.nextFollowUp&&o.nextFollowUp<=endDate),wins=db.wins||[],weekWins=wins.filter(w=>w.date>=start&&w.date<=endDate);
 const days=[['Monday','Business Plan','Review numbers, gaps, specialists, bottom departments'],['Tuesday','Customer & Pipeline','Work customers, quotes, MVD and new opportunities'],['Wednesday','Team Accountability','Walks, coaching, specialist commitments and recognition'],['Thursday','Execution','Delivery, flatbed, install/service and overdue issues'],['Friday','Results & Recovery','Close the week, document wins and build next week']];
 return '<div class="card"><div class="row"><div><h2>Weekly Command Board</h2><p class="small">Week of '+dateFmt(start)+' through '+dateFmt(endDate)+'</p></div><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div><div class="grid">'+metric('Open Week Actions',open.length,open.length?'watch':'good')+metric('Completed Week Actions',done.length,'good')+metric('Overdue Actions',overdue.length,overdue.length?'bad':'good')+metric('Follow-ups This Week',follow.length,follow.length?'watch':'good')+metric('Week Wins',weekWins.length,'good')+'</div></div><div class="card"><h2>Monday–Friday Management Cadence</h2><table><tr><th>Day</th><th>Theme</th><th>Management Focus</th></tr>'+days.map(d=>'<tr><td><b>'+d[0]+'</b></td><td>'+d[1]+'</td><td>'+d[2]+'</td></tr>').join('')+'</table></div><div class="card"><h2>Week Accountability</h2><table><tr><th>Item</th><th>Count</th><th>Leadership Move</th></tr><tr><td>Open actions due this week</td><td>'+open.length+'</td><td>Assign owners and dates; close the loop.</td></tr><tr><td>Overdue actions</td><td class="bad">'+overdue.length+'</td><td>Address before adding new work.</td></tr><tr><td>Customer follow-ups</td><td>'+follow.length+'</td><td>Work highest-value opportunities first.</td></tr><tr><td>Recognition wins</td><td>'+weekWins.length+'</td><td>Use wins to reinforce repeatable behaviors.</td></tr></table></div>'
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pro-command-center-backup-'+dateToday()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=Object.assign(blank(),JSON.parse(r.result));save();alert('Backup restored.')}catch(e){alert('That backup could not be read.')}};r.readAsText(f)}
function clearAll(){if(confirm('Delete all Command Center data from this browser? This cannot be undone unless you have an exported backup.')){db=blank();save()}}
function v(id){return document.getElementById(id)?.value||''}
function upsert(type,obj){const i=db[type].findIndex(x=>x.id===obj.id);if(i>=0)db[type][i]=obj;else db[type].push(obj);save()}
function del(type,i){if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!==i);save()}}

render();
</script>
