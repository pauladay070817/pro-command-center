<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<link rel="manifest" href="manifest.json">
<title>Pro Business Command Center</title>
<style>
:root{--blue:#0057b8;--blue2:#0b3d91;--green:#16823b;--red:#c62828;--yellow:#f0b429;--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--border:#d9dee7;--shadow:0 3px 14px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:18px 20px;position:sticky;top:0;z-index:20}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;font-size:13px;opacity:.9}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:78px;z-index:19}.tabs button{border:0;background:#e9eef7;color:#17335f;padding:9px 13px;border-radius:8px;font-weight:700;white-space:nowrap;cursor:pointer}.tabs button.active{background:var(--blue);color:#fff}.wrap{max-width:1200px;margin:0 auto;padding:18px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}h2{margin:0 0 14px;font-size:21px}h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:14px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:22px;font-weight:800;margin-top:5px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:#8a5a00}label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd2dc;border-radius:8px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.field{margin-bottom:10px}button{font:inherit}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#e8edf5;color:#1d3557}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.yellow{background:var(--yellow);color:#332300}.actions{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;font-size:13px;vertical-align:top}.table th{background:#f7f9fc}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#e9eef7;font-size:11px;font-weight:700}.empty{padding:24px;text-align:center;color:var(--muted)}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photo{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}.photo img{width:100%;height:130px;object-fit:cover;display:block}.photo .cap{padding:8px;font-size:11px}.small{font-size:12px;color:var(--muted)}.danger-note{padding:10px;border-left:4px solid var(--red);background:#fff4f4;border-radius:5px;font-size:12px}.success-note{padding:10px;border-left:4px solid var(--green);background:#f1fbf4;border-radius:5px;font-size:12px}.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:14px;padding:20px}.right{text-align:right}@media(max-width:850px){.grid,.grid2,.kpi-row{grid-template-columns:1fr 1fr}.photo-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.grid2,.kpi-row{grid-template-columns:1fr}.tabs{top:71px}header h1{font-size:20px}.wrap{padding:10px}.card{padding:13px}}
</style>
</head>
<body>
<header><h1>Pro Business Command Center</h1><p>Store → Departments → Product Groups → Pro → Specialists → Action Plans</p></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap">
<section id="dashboard" class="page active"></section>
<section id="numbers" class="page"></section>
<section id="specialists" class="page"></section>
<section id="departments" class="page"></section>
<section id="products" class="page"></section>
<section id="actions" class="page"></section>
<section id="walks" class="page"></section>
<section id="settings" class="page"></section>
</main>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='proCommandCenterV2';
const tabs=[['dashboard','Dashboard'],['numbers','Numbers'],['specialists','Specialists'],['departments','Departments'],['products','Product Groups'],['actions','Action Plans'],['walks','Daily Walks'],['settings','Backup / Settings']];
const blank={numbers:[],specialists:[],departments:[],products:[],actions:[],walks:[]};
let db=load(); let current='dashboard';
function load(){try{return Object.assign(blank,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return structuredClone(blank)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}
function num(n){return Number(n)||0}
function pct(n){return (Number(n)||0).toFixed(2)+'%'}
function variance(sales,comp){return num(sales)*(num(comp)/100)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function dateNow(){return new Date().toISOString().slice(0,10)}
function showPage(p){current=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function setupTabs(){document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>`<button data-page="${id}" onclick="showPage('${id}')">${label}</button>`).join('')}
function render(){renderDashboard();renderNumbers();renderSpecialists();renderDepartments();renderProducts();renderActions();renderWalks();renderSettings();showActive()}
function showActive(){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===current));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.page===current))}
function latest(){return db.numbers.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]||{}}
function renderDashboard(){let n=latest();let top=db.products.slice().sort((a,b)=>num(b.variance)-num(a.variance)).slice(0,5);let open=db.actions.filter(a=>a.status!=='Complete').length;document.getElementById('dashboard').innerHTML=`<div class="card"><h2>Store Performance</h2><div class="kpi-row"><div class="stat"><div class="label">Store Sales</div><div class="value">${money(n.storeSales)}</div></div><div class="stat"><div class="label">Store Plan</div><div class="value">${money(n.storePlan)}</div></div><div class="stat"><div class="label">Store Variance</div><div class="value ${num(n.storeSales)-num(n.storePlan)>=0?'good':'bad'}">${money(num(n.storeSales)-num(n.storePlan))}</div></div><div class="stat"><div class="label">Pro Sales</div><div class="value">${money(n.proSales)}</div></div><div class="stat"><div class="label">Pro Plan</div><div class="value">${money(n.proPlan)}</div></div><div class="stat"><div class="label">Pro Variance</div><div class="value ${num(n.proSales)-num(n.proPlan)>=0?'good':'bad'}">${money(num(n.proSales)-num(n.proPlan))}</div></div></div></div>
<div class="card"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="showPage('numbers')">+ Enter Numbers</button><button class="btn" onclick="showPage('walks')">Daily Walk</button><button class="btn" onclick="showPage('departments')">Departments</button><button class="btn" onclick="showPage('actions')">Action Plan</button><button class="btn secondary" onclick="showPage('products')">Product Groups</button></div></div>
<div class="grid2"><div class="card"><h2>Top Opportunities</h2>${top.length?`<div class="tablewrap"><table class="table"><tr><th>Product Group</th><th>Sales</th><th>Comp</th><th>Variance $</th></tr>${top.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.sales)}</td><td>${pct(x.comp)}</td><td class="${num(x.variance)<0?'bad':'good'}">${money(x.variance)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Add product-group numbers to see opportunities.</div>'}</div><div class="card"><h2>Open Action Plans</h2><div class="stat"><div class="label">Open actions</div><div class="value">${open}</div></div><p class="small">Use the Action Plans tab to assign an owner, goal, due date and follow-up status.</p></div></div>`}
function renderNumbers(){document.getElementById('numbers').innerHTML=`<div class="card"><h2>Store & Pro Numbers</h2><div class="grid2"><div class="field"><label>Date</label><input id="nDate" type="date" value="${dateNow()}"></div><div class="field"><label>Pro Credit</label><input id="nCredit" type="number" step="1" placeholder="0"></div><div class="field"><label>Total Store Sales</label><input id="nStore" type="number" step="0.01" placeholder="0"></div><div class="field"><label>Store Sales Plan</label><input id="nStorePlan" type="number" step="0.01" placeholder="0"></div><div class="field"><label>Pro Sales</label><input id="nPro" type="number" step="0.01" placeholder="0"></div><div class="field"><label>Pro Sales Plan</label><input id="nProPlan" type="number" step="0.01" placeholder="0"></div><div class="field"><label>Pro Comp % (optional)</label><input id="nComp" type="number" step="0.01" placeholder="e.g. -9.47"></div></div><div class="actions"><button class="btn" onclick="addNumber()">Save Numbers</button><button class="btn secondary" onclick="clearNumberForm()">Clear</button></div></div><div class="card"><h2>Saved Weeks / Days</h2>${db.numbers.length?`<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Store</th><th>Store Plan</th><th>Store Var</th><th>Pro</th><th>Pro Plan</th><th>Pro Var</th><th>Comp</th><th>Credit</th><th></th></tr>${db.numbers.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((x,i)=>`<tr><td>${esc(x.date)}</td><td>${money(x.storeSales)}</td><td>${money(x.storePlan)}</td><td>${money(num(x.storeSales)-num(x.storePlan))}</td><td>${money(x.proSales)}</td><td>${money(x.proPlan)}</td><td>${money(num(x.proSales)-num(x.proPlan))}</td><td>${x.comp===''?'—':pct(x.comp)}</td><td>${num(x.credit)}</td><td><button class="btn secondary" onclick="editNumber('${x.id}')">Edit</button> <button class="btn red" onclick="del('numbers','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No numbers yet.</div>'}</div>`}
function addNumber(){let x={id:id(),date:document.getElementById('nDate').value,storeSales:num(document.getElementById('nStore').value),storePlan:num(document.getElementById('nStorePlan').value),proSales:num(document.getElementById('nPro').value),proPlan:num(document.getElementById('nProPlan').value),comp:document.getElementById('nComp').value,credit:num(document.getElementById('nCredit').value)};if(!x.date){alert('Please enter a date.');return}db.numbers=db.numbers.filter(a=>a.date!==x.date);db.numbers.push(x);save();alert('Numbers saved.');}
function clearNumberForm(){['nStore','nStorePlan','nPro','nProPlan','nComp','nCredit'].forEach(x=>document.getElementById(x).value='');document.getElementById('nDate').value=dateNow()}
function editNumber(i){let x=db.numbers.find(a=>a.id===i);if(!x)return;showPage('numbers');setTimeout(()=>{document.getElementById('nDate').value=x.date;document.getElementById('nStore').value=x.storeSales;document.getElementById('nStorePlan').value=x.storePlan;document.getElementById('nPro').value=x.proSales;document.getElementById('nProPlan').value=x.proPlan;document.getElementById('nComp').value=x.comp;document.getElementById('nCredit').value=x.credit;db.numbers=db.numbers.filter(a=>a.id!==i);localStorage.setItem(KEY,JSON.stringify(db));renderNumbers();},0)}
function renderSpecialists(){document.getElementById('specialists').innerHTML=`<div class="card"><h2>Pro Specialists</h2><div class="grid2"><div class="field"><label>Name</label><input id="spName" placeholder="Specialist name"></div><div class="field"><label>Goal</label><input id="spGoal" type="number" placeholder="0"></div><div class="field"><label>Sales</label><input id="spSales" type="number" placeholder="0"></div><div class="field"><label>Pro Sales</label><input id="spPro" type="number" placeholder="0"></div><div class="field"><label>Customer Opportunities</label><input id="spOpp" type="number" placeholder="0"></div><div class="field"><label>Notes</label><input id="spNotes" placeholder="Follow-up / coaching note"></div></div><button class="btn" onclick="addSpecialist()">Save Specialist</button></div><div class="card"><h2>Specialist Scorecard</h2>${tableSpecialists()}</div>`}
function tableSpecialists(){return db.specialists.length?`<div class="tablewrap"><table class="table"><tr><th>Name</th><th>Goal</th><th>Sales</th><th>Variance</th><th>Pro Sales</th><th>Opps</th><th>Notes</th><th></th></tr>${db.specialists.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.goal)}</td><td>${money(x.sales)}</td><td class="${num(x.sales)-num(x.goal)>=0?'good':'bad'}">${money(num(x.sales)-num(x.goal))}</td><td>${money(x.pro)}</td><td>${num(x.opp)}</td><td>${esc(x.notes)}</td><td><button class="btn red" onclick="del('specialists','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No specialists entered yet.</div>'}
function addSpecialist(){let x={id:id(),name:document.getElementById('spName').value.trim(),goal:num(document.getElementById('spGoal').value),sales:num(document.getElementById('spSales').value),pro:num(document.getElementById('spPro').value),opp:num(document.getElementById('spOpp').value),notes:document.getElementById('spNotes').value};if(!x.name){alert('Enter a specialist name.');return}db.specialists.push(x);save();}
function renderDepartments(){document.getElementById('departments').innerHTML=`<div class="card"><h2>Department Performance</h2><div class="grid2"><div class="field"><label>Department</label><input id="dName" placeholder="e.g. Lumber, Millwork, Pro, Electrical"></div><div class="field"><label>Sales</label><input id="dSales" type="number"></div><div class="field"><label>Plan</label><input id="dPlan" type="number"></div><div class="field"><label>Comp %</label><input id="dComp" type="number" step="0.01" placeholder="e.g. -8.25"></div><div class="field"><label>Pro Sales</label><input id="dPro" type="number"></div><div class="field"><label>Opportunity / Reason</label><input id="dOpp" placeholder="Why is this up/down?"></div></div><button class="btn" onclick="addDepartment()">Save Department</button></div><div class="card"><h2>Department Scorecard</h2>${db.departments.length?`<div class="tablewrap"><table class="table"><tr><th>Department</th><th>Sales</th><th>Plan</th><th>Variance $</th><th>Comp</th><th>Pro Sales</th><th>Opportunity</th><th></th></tr>${db.departments.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.sales)}</td><td>${money(x.plan)}</td><td class="${num(x.sales)-num(x.plan)>=0?'good':'bad'}">${money(num(x.sales)-num(x.plan))}</td><td class="${num(x.comp)>=0?'good':'bad'}">${pct(x.comp)}</td><td>${money(x.pro)}</td><td>${esc(x.opp)}</td><td><button class="btn red" onclick="del('departments','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No department data yet.</div>'}</div>`}
function addDepartment(){let x={id:id(),name:document.getElementById('dName').value.trim(),sales:num(document.getElementById('dSales').value),plan:num(document.getElementById('dPlan').value),comp:num(document.getElementById('dComp').value),pro:num(document.getElementById('dPro').value),opp:document.getElementById('dOpp').value};if(!x.name){alert('Enter a department.');return}db.departments=db.departments.filter(a=>a.name.toLowerCase()!==x.name.toLowerCase());db.departments.push(x);save();}
function renderProducts(){let sorted=db.products.slice().sort((a,b)=>num(a.variance)-num(b.variance));document.getElementById('products').innerHTML=`<div class="card"><h2>Product Groups</h2><div class="grid2"><div class="field"><label>Product Group</label><input id="pName" placeholder="e.g. Dimensional Lumber"></div><div class="field"><label>Sales</label><input id="pSales" type="number"></div><div class="field"><label>Plan</label><input id="pPlan" type="number"></div><div class="field"><label>Comp %</label><input id="pComp" type="number" step="0.01"></div><div class="field"><label>Pro Sales</label><input id="pPro" type="number"></div><div class="field"><label>Opportunity / Root Cause</label><input id="pOpp" placeholder="What is driving the result?"></div></div><button class="btn" onclick="addProduct()">Save Product Group</button></div><div class="card"><h2>Bottom Performing / Opportunity Groups</h2>${sorted.length?`<div class="tablewrap"><table class="table"><tr><th>Product Group</th><th>Sales</th><th>Plan</th><th>Comp</th><th>Variance $</th><th>Pro</th><th>Root Cause</th><th></th></tr>${sorted.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${money(x.sales)}</td><td>${money(x.plan)}</td><td class="${num(x.comp)>=0?'good':'bad'}">${pct(x.comp)}</td><td class="${num(x.variance)>=0?'good':'bad'}">${money(x.variance)}</td><td>${money(x.pro)}</td><td>${esc(x.opp)}</td><td><button class="btn red" onclick="del('products','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Add product groups. The list automatically sorts the lowest variance first.</div>'}</div>`}
function addProduct(){let sales=num(document.getElementById('pSales').value),comp=num(document.getElementById('pComp').value);let x={id:id(),name:document.getElementById('pName').value.trim(),sales,plan:num(document.getElementById('pPlan').value),comp,variance:variance(sales,comp),pro:num(document.getElementById('pPro').value),opp:document.getElementById('pOpp').value};if(!x.name){alert('Enter a product group.');return}db.products=db.products.filter(a=>a.name.toLowerCase()!==x.name.toLowerCase());db.products.push(x);save();}
function renderActions(){document.getElementById('actions').innerHTML=`<div class="card"><h2>Action Plan</h2><div class="grid2"><div class="field"><label>Date</label><input id="aDate" type="date" value="${dateNow()}"></div><div class="field"><label>Department / Product Group</label><input id="aArea" placeholder="Area"></div><div class="field"><label>Opportunity</label><textarea id="aOpp" placeholder="What needs to improve?"></textarea></div><div class="field"><label>Action</label><textarea id="aAction" placeholder="Specific action to take"></textarea></div><div class="field"><label>Owner</label><input id="aOwner" placeholder="Associate / Specialist / Manager"></div><div class="field"><label>Goal</label><input id="aGoal" placeholder="Measurable goal"></div><div class="field"><label>Due Date</label><input id="aDue" type="date"></div><div class="field"><label>Status</label><select id="aStatus"><option>Open</option><option>In Progress</option><option>Complete</option></select></div></div><button class="btn" onclick="addAction()">Save Action Plan</button></div><div class="card"><h2>Open & Completed Actions</h2>${db.actions.length?`<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Area</th><th>Opportunity</th><th>Action</th><th>Owner</th><th>Goal</th><th>Due</th><th>Status</th><th></th></tr>${db.actions.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.area)}</td><td>${esc(x.opp)}</td><td>${esc(x.action)}</td><td>${esc(x.owner)}</td><td>${esc(x.goal)}</td><td>${esc(x.due)}</td><td><span class="pill">${esc(x.status)}</span></td><td><button class="btn secondary" onclick="toggleAction('${x.id}')">${x.status==='Complete'?'Reopen':'Complete'}</button> <button class="btn red" onclick="del('actions','${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No action plans yet.</div>'}</div>`}
function addAction(){let x={id:id(),date:document.getElementById('aDate').value,area:document.getElementById('aArea').value,opp:document.getElementById('aOpp').value,action:document.getElementById('aAction').value,owner:document.getElementById('aOwner').value,goal:document.getElementById('aGoal').value,due:document.getElementById('aDue').value,status:document.getElementById('aStatus').value};if(!x.area||!x.action){alert('Enter at least an area and action.');return}db.actions.push(x);save();}
function toggleAction(i){let x=db.actions.find(a=>a.id===i);if(x){x.status=x.status==='Complete'?'Open':'Complete';save()}}
function renderWalks(){document.getElementById('walks').innerHTML=`<div class="card"><h2>Daily Walk & Photo Log</h2><div class="grid2"><div class="field"><label>Date</label><input id="wDate" type="date" value="${dateNow()}"></div><div class="field"><label>Department / Area</label><input id="wArea" placeholder="e.g. Lumber bullpen, Millwork, Pro Desk"></div><div class="field"><label>Result / What I Found</label><textarea id="wResult"></textarea></div><div class="field"><label>Opportunity</label><textarea id="wOpp"></textarea></div><div class="field"><label>Action</label><textarea id="wAction"></textarea></div><div class="field"><label>Owner / Follow-up</label><input id="wOwner"></div><div class="field"><label>Photos</label><input id="wPhotos" type="file" accept="image/*" multiple></div></div><button class="btn" onclick="addWalk()">Save Daily Walk</button><p class="small">Photos are stored in this browser on this device. Use Backup / Settings to export your records.</p></div><div class="card"><h2>Walk History</h2>${db.walks.length?db.walks.slice().reverse().map(x=>`<div class="card" style="box-shadow:none;margin:0 0 10px"><div><b>${esc(x.date)}</b> · <span class="pill">${esc(x.area)}</span></div><p><b>Result:</b> ${esc(x.result)}</p><p><b>Opportunity:</b> ${esc(x.opp)}</p><p><b>Action:</b> ${esc(x.action)}</p><p><b>Owner:</b> ${esc(x.owner)}</p>${x.photos?.length?`<div class="photo-grid">${x.photos.map(p=>`<div class="photo"><img src="${p.data}" alt="Walk photo"><div class="cap">${esc(p.name)}</div></div>`).join('')}</div>`:''}<div class="right" style="margin-top:8px"><button class="btn red" onclick="del('walks','${x.id}')">Delete Walk</button></div></div>`).join(''):'<div class="empty">No daily walks yet.</div>'}</div>`}
async function addWalk(){let files=[...document.getElementById('wPhotos').files];let photos=[];for(const f of files){if(f.size>2_000_000){alert(f.name+' is over 2 MB. Please use a smaller photo.');return}photos.push({name:f.name,data:await readFile(f)})}let x={id:id(),date:document.getElementById('wDate').value,area:document.getElementById('wArea').value,result:document.getElementById('wResult').value,opp:document.getElementById('wOpp').value,action:document.getElementById('wAction').value,owner:document.getElementById('wOwner').value,photos};db.walks.push(x);save();alert('Daily walk saved.');}
function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><h2>Backup / Restore</h2><p class="small">Your dashboard data is stored locally in this browser. Export a backup regularly, especially after adding photos.</p><div class="actions"><button class="btn" onclick="exportBackup()">Export Backup</button><label class="btn secondary" style="display:inline-block;cursor:pointer">Restore Backup<input type="file" accept="application/json" onchange="restoreBackup(event)" style="display:none"></label><button class="btn red" onclick="wipeData()">Clear All Data</button></div></div><div class="card"><h2>System Status</h2><div class="success-note">Local data storage is active. ${'serviceWorker' in navigator?'Service worker support detected.':'Service worker not available in this browser.'}</div><p class="small">Version 2.0 · Static GitHub Pages app · No server/database required.</p></div>`}
function exportBackup(){let blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pro-command-center-backup-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!o.data)throw Error();db=Object.assign(structuredClone(blank),o.data);save();alert('Backup restored.')}catch(err){alert('That backup file is not valid.')}};r.readAsText(f)}
function wipeData(){if(confirm('This will permanently clear all dashboard data in this browser. Export a backup first. Continue?')){localStorage.removeItem(KEY);db=structuredClone(blank);render()}}
function del(type,i){if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!==i);save()}}
setupTabs();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
